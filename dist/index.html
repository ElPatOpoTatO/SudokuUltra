<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sudoku</title>
<style>
/* =========================================================================
   1. TOKENS (light default, dark via prefers-color-scheme)
   ========================================================================= */
:root {
  --bg: #f2f1ee;
  --surface: #fbfaf8;
  --ink: #1c1e22;
  --ink-2: #5d6168;
  --ink-3: #8f939a;
  --line: #dcd9d3;
  --line-strong: #7d7a75;
  --accent: #3767e8;
  --accent-ink: #2552cc;
  --accent-soft: rgba(55, 103, 232, .075);
  --accent-sel: rgba(55, 103, 232, .20);
  --accent-same: rgba(55, 103, 232, .15);
  --accent-glow: rgba(55, 103, 232, .26);
  --err: #d2413a;
  --err-soft: rgba(210, 65, 58, .30);

  /* keycaps */
  --cap-hi: #ffffff;
  --cap: #f1efeb;
  --cap-ink: #26282d;
  --cap-edge: rgba(0, 0, 0, .07);
  --wall: #c4c0b8;
  --mod-hi: #e9e7e2;
  --mod: #dedbd5;
  --mod-wall: #aeaaa2;
  --key-shadow: rgba(40, 32, 20, .22);
  --cap-inset-hi: rgba(255, 255, 255, .85);

  --radius-key: 12px;
  --travel: 3.5px;      /* full press travel */
  --latch: 2.5px;       /* latched (held-down) depth */
  --kh: clamp(46px, 7.4dvh, 66px);  /* key height */
  --release: 150ms;     /* upstroke: snappier, with a small overshoot */
  --spring: cubic-bezier(.25, 1.42, .5, 1);
  --flash: rgba(55, 103, 232, .20);   /* 1-frame landing flash */
  --rub: rgba(226, 132, 146, .26);    /* eraser highlight (soft pink rubber) */
  --graphite: rgba(70, 72, 78, .10);  /* pencil-mode shimmer */
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a;
    --surface: #1f2125;
    --ink: #eceef1;
    --ink-2: #a3a8b0;
    --ink-3: #6f747c;
    --line: #2f3238;
    --line-strong: #5d626b;
    --accent: #7ea3ff;
    --accent-ink: #9bb8ff;
    --accent-soft: rgba(126, 163, 255, .07);
    --accent-sel: rgba(126, 163, 255, .22);
    --accent-same: rgba(126, 163, 255, .15);
    --accent-glow: rgba(126, 163, 255, .28);
    --err: #ff6b62;
    --err-soft: rgba(255, 107, 98, .30);

    --cap-hi: #34373e;
    --cap: #2a2d33;
    --cap-ink: #e9ebef;
    --cap-edge: rgba(255, 255, 255, .04);
    --wall: #0f1012;
    --mod-hi: #2b2e34;
    --mod: #23262b;
    --mod-wall: #0b0c0e;
    --key-shadow: rgba(0, 0, 0, .55);
    --cap-inset-hi: rgba(255, 255, 255, .07);
    --flash: rgba(255, 255, 255, .13);
    --rub: rgba(255, 176, 188, .16);
    --graphite: rgba(205, 210, 220, .08);
  }
}
@media (prefers-reduced-motion: reduce) {
  :root { --release: 70ms; --spring: ease-out; }
}

/* =========================================================================
   2. BASE / KILL BROWSER TOUCH DEFAULTS
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}

/* =========================================================================
   3. LAYOUT (portrait, one screen, safe areas)
   ========================================================================= */
.app {
  height: 100vh; height: 100dvh;
  max-width: 500px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding:
    max(env(safe-area-inset-top), 8px)
    max(env(safe-area-inset-right), 14px)
    max(env(safe-area-inset-bottom), 14px)
    max(env(safe-area-inset-left), 14px);
}

/* Header */
.hdr { flex: none; height: 44px; display: flex; align-items: center; gap: 10px; }
.stat { display: flex; flex-direction: column; line-height: 1.05; min-width: 64px; }
.stat .lbl { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.stat .num { font-size: 19px; font-weight: 650; color: var(--ink); }
.stat .num.bad { color: var(--err); }
.stat .num { transform-origin: 0 60%; }
.status { flex: 1; text-align: center; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status b { color: var(--accent-ink); font-weight: 650; }
.hbtns { display: flex; gap: 4px; min-width: 64px; justify-content: flex-end; }
.hbtn {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  color: var(--ink-2); cursor: pointer; touch-action: none;
  transition: transform 160ms var(--spring), opacity 160ms;
}
.hbtn.down { transform: scale(.88); opacity: .6; transition-duration: 0s; }
.hbtn svg { width: 20px; height: 20px; }
.hbtn .ic-off { display: none; }
.hbtn.muted .ic-on { display: none; }
.hbtn.muted .ic-off { display: block; }

/* Board area: a size container so the board is the largest square that fits */
.board-wrap {
  flex: 1 1 0; min-height: 0; position: relative;
  container-type: size;
  display: grid; place-items: center;
}

/* =========================================================================
   4. BOARD
   ========================================================================= */
.board {
  width: min(92vw, 52vh);              /* fallback */
  width: min(100cqw, 100cqh);
  aspect-ratio: 1 / 1;
  container-type: inline-size;         /* children size text with cqw */
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  gap: 2px; padding: 2px;
  background: var(--line-strong);
  border-radius: 12px; overflow: hidden;
  touch-action: none;
}
.box { display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 1px; background: var(--line); }
.cell {
  position: relative; background: var(--surface);
  cursor: pointer; overflow: hidden;
}
/* tints layered over the opaque surface (no color-mix, works on older Safari) */
/* peer tint lives on its own layer so it can sweep outward (opacity only) */
.cell .fx-t { background: var(--accent-soft); }
.cell.peer .fx-t { opacity: 1; }
.cell.peer.same .fx-t { opacity: 0; }
.cell.same { background-image: linear-gradient(var(--accent-same), var(--accent-same)); }
.board.loaded .cell.same { background-image: linear-gradient(var(--accent-glow), var(--accent-glow)); }
.cell.sel { background-image: linear-gradient(var(--accent-sel), var(--accent-sel)); }
.cell.sel::before {
  content: ""; position: absolute; inset: 0; border-radius: 2px;
  box-shadow: inset 0 0 0 2px var(--accent); pointer-events: none;
}
/* value layer */
.cell .v {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 6.3cqw; line-height: 1; font-weight: 450; color: var(--accent-ink);
  will-change: transform;
}
.cell.given .v { color: var(--ink); font-weight: 640; }
.cell.conflict .v { color: var(--err); }
.board.loaded .cell.same .v { font-weight: 700; }
/* notes 3x3 */
.cell .notes {
  position: absolute; inset: 5%;
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
}
.cell .notes span {
  display: grid; place-items: center;
  font-size: 2.65cqw; line-height: 1; color: var(--ink-2); font-weight: 520;
  opacity: 0;
}
.cell .notes span.on { opacity: 1; }
.cell .notes span.hit { color: var(--accent-ink); font-weight: 760; }
/* effect layers (animated with opacity only) */
.cell .fx { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.cell .fx-a { background: var(--accent-glow); }
.cell .fx-e { background: var(--err-soft); }
.cell .fx-f { background: var(--flash); }
.cell .fx-g { background: var(--graphite); }
/* erase: a ghost of what was there + an eraser-shaped highlight (both transient) */
.cell .ghost { pointer-events: none; }
.cell .rub {
  position: absolute; top: -12%; height: 124%; left: 28%; width: 44%;
  border-radius: 45%; background: var(--rub); opacity: 0; pointer-events: none;
  will-change: transform, opacity;
}

/* Fallback text sizing if cq units are unsupported */
@supports not (width: 1cqw) {
  .cell .v { font-size: min(5.6vw, 3.2vh); }
  .cell .notes span { font-size: min(2.4vw, 1.4vh); }
}

/* =========================================================================
   5. KEYCAPS
   Structure: .key > .shadow + .wall + .cap
   - .wall is the static "side" of the key, visible under the cap
   - .cap travels down with transform only; .shadow fades (opacity only)
   ========================================================================= */
.pad {
  flex: none;
  display: grid; grid-template-columns: repeat(3, 1fr) 1.18fr;
  gap: 9px 8px;
  touch-action: none;
}
.key { position: relative; height: var(--kh); cursor: pointer; touch-action: none; }
.key .shadow {
  position: absolute; left: 3px; right: 3px; top: 10px; bottom: -1px;
  border-radius: var(--radius-key);
  box-shadow: 0 6px 12px -3px var(--key-shadow), 0 2px 3px -1px var(--key-shadow);
  transition: opacity var(--release) ease-out;
}
.key .wall {
  position: absolute; left: 0; right: 0; top: 8px; bottom: 0;
  border-radius: var(--radius-key); background: var(--wall);
}
.key .cap {
  position: absolute; left: 0; right: 0; top: 0; bottom: 4px;
  border-radius: var(--radius-key);
  background: linear-gradient(180deg, var(--cap-hi) 0%, var(--cap) 70%);
  box-shadow: inset 0 1px 0 var(--cap-inset-hi), inset 0 0 0 1px var(--cap-edge), inset 0 -3px 4px -2px rgba(0,0,0,.06);
  color: var(--cap-ink);
  display: grid; place-items: center;
  transform: translate3d(0, 0, 0);
  transition: transform var(--release) var(--spring);
  will-change: transform;
}
/* press tint: opacity-only overlay */
.key .cap::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: rgba(0, 0, 0, .06); opacity: 0; transition: opacity var(--release);
}
/* PRESSED — applied on the exact pointerdown frame, no transition in */
.key.down .cap { transform: translate3d(0, var(--travel), 0); transition-duration: 0s; }
.key.down .cap::after { opacity: 1; transition-duration: 0s; }
.key.down .shadow { opacity: .25; transition-duration: 0s; }
/* LATCHED — stays partly down */
.key.latched .cap { transform: translate3d(0, var(--latch), 0); }
.key.latched .shadow { opacity: .45; }
.key.latched.down .cap { transform: translate3d(0, var(--travel), 0); }

/* digit key content */
.key .lg { font-size: clamp(22px, 3.6dvh, 30px); font-weight: 560; line-height: 1; }
.key .cnt {
  position: absolute; top: 5px; right: 8px;
  font-size: 10.5px; font-weight: 650; color: var(--ink-3); line-height: 1;
}
.key .led {
  position: absolute; top: 7px; left: 8px; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 6px var(--accent);
  opacity: 0; transition: opacity 120ms;
}
.key.latched .led { opacity: 1; }
.key.digit.latched .lg { color: var(--accent-ink); }
.key.digit.note-latched .lg { font-size: clamp(16px, 2.6dvh, 21px); }
.key.digit.locked .lg, .key.digit.locked .cnt { opacity: .28; }
.key.digit.locked .cap { transform: translate3d(0, 1.2px, 0); }
.key.digit.locked.down .cap { transform: translate3d(0, var(--travel), 0); }

/* modifier keys (Undo / Erase / Pencil) */
.key.mod .wall { background: var(--mod-wall); }
.key.mod .cap { background: linear-gradient(180deg, var(--mod-hi) 0%, var(--mod) 75%); }
.key.mod .cap { grid-template-rows: auto auto; align-content: center; gap: 3px; }
.key.mod svg { width: 20px; height: 20px; justify-self: center; }
.key.mod .lbl { font-size: 11px; font-weight: 620; letter-spacing: .02em; color: var(--ink-2); }
.key.mod.latched .lbl, .key.mod.latched svg { color: var(--accent-ink); }

@media (hover: hover) {
  .key:hover .cap::after { opacity: .5; }
  .key.down:hover .cap::after { opacity: 1; }
}

/* =========================================================================
   6. SOLVED TOAST
   ========================================================================= */
.toast {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -40%) scale(.96); opacity: 0; pointer-events: none;
  background: var(--surface); color: var(--ink);
  border-radius: 18px; padding: 18px 20px 16px; min-width: 210px; text-align: center;
  box-shadow: 0 18px 50px -12px rgba(0,0,0,.35), 0 0 0 1px var(--line);
  transition: opacity 260ms ease-out, transform 360ms var(--spring);
}
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
.toast h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
.toast p { margin: 0 0 14px; font-size: 13px; color: var(--ink-2); }
.toast .key { width: 150px; margin: 0 auto; --kh: 48px; }
.toast .key .lbl { font-size: 14px; font-weight: 650; color: var(--cap-ink); }
/* =========================================================================
   PROGRESS TOKEN SHEET
   ========================================================================= */
.sheet-bg {
  position: fixed; inset: 0; z-index: 50; background: rgba(10, 10, 12, .38);
  opacity: 0; pointer-events: none; transition: opacity 220ms ease-out;
}
.sheet-bg.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 50%; bottom: 0; z-index: 51;
  width: min(520px, 100%); box-sizing: border-box;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  background: var(--surface); color: var(--ink);
  border-radius: 20px 20px 0 0; box-shadow: 0 -12px 40px -10px rgba(0,0,0,.35), 0 0 0 1px var(--line);
  transform: translate(-50%, 105%); transition: transform 360ms var(--spring);
}
.sheet.show { transform: translate(-50%, 0); }
.sheet h2 { margin: 0 0 2px; font-size: 18px; font-weight: 700; }
.sheet .sub { margin: 0 0 12px; font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }
.sheet label { display: block; font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 10px 0 5px; }
.sheet textarea {
  width: 100%; box-sizing: border-box; height: 74px; resize: none;
  font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  -webkit-user-select: text; user-select: text; touch-action: auto;
}
.sheet textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.sheet .row { display: flex; gap: 10px; margin-top: 8px; }
.sheet .row .key { flex: 1; --kh: 44px; }
.sheet .row .key .lbl { font-size: 14px; font-weight: 650; color: var(--cap-ink); }
.sheet .msg { min-height: 18px; margin: 8px 0 0; font-size: 12.5px; color: var(--ink-2); }
.sheet .msg.ok { color: var(--accent-ink); }
.sheet .msg.bad { color: var(--err); }
/* =========================================================================
   PARTICLE OVERLAY (one canvas, never intercepts input)
   ========================================================================= */
.fxc { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
/* =========================================================================
   SHELL ADDITIONS (not in the feel prototype; all inside the header or in
   hidden-by-default overlays, so the board and pad render identically)
   ========================================================================= */
.hdr { position: relative; }
/* DEV: current puzzle id + mode, tap to open the dev menu */
.pid {
  position: absolute; left: 50%; top: 1px; transform: translateX(-50%);
  max-width: 56%; padding: 1px 7px; border-radius: 7px;
  font-size: 9.5px; line-height: 1.25; font-weight: 650; letter-spacing: .04em;
  color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer; touch-action: none;
}
.pid b { color: var(--err); font-weight: 750; }
/* Dead-end banner: slides over the header, never blocks the board */
.dead {
  position: absolute; inset: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px; padding: 0 2px;
  background: var(--bg);
  opacity: 0; transform: translateY(-6px); pointer-events: none;
  transition: opacity 200ms ease-out, transform 300ms var(--spring);
}
.dead.show { opacity: 1; transform: none; pointer-events: auto; }
.dead .msg { flex: 1; font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dead .key { width: 112px; --kh: 40px; flex: none; }
.dead .key .cap { grid-template-columns: auto auto; grid-template-rows: none; justify-content: center; gap: 7px; }
.dead .key .lbl { font-size: 12.5px; font-weight: 650; color: var(--cap-ink); }
.dead .key svg { width: 17px; height: 17px; }
/* DEV menu sheet (reuses .sheet) */
.sheet.dev { max-height: 86dvh; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.sheet.dev h2 b { color: var(--err); }
.dev .grp { margin: 10px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.dev .wrow { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin: 3px 0; }
.dev .wrow .tag { width: 64px; font-size: 11px; font-weight: 650; color: var(--ink-2); white-space: nowrap; }
.dev .wrow.grid { display: grid; grid-template-columns: 64px repeat(12, minmax(0, 1fr)); gap: 3px; }
.dev .wrow.grid .tag { width: auto; }
.dev .wrow.grid .chip { min-width: 0; padding: 0; }
.dev .chip {
  min-width: 21px; height: 26px; padding: 0 4px; border-radius: 7px; display: inline-grid; place-items: center;
  background: var(--bg); color: var(--ink); border: 1px solid var(--line);
  font-size: 11.5px; font-weight: 600; cursor: pointer; touch-action: manipulation;
}
.dev .chip.cur { border-color: var(--accent); color: var(--accent-ink); box-shadow: inset 0 0 0 1px var(--accent); }
.dev .chip.done::after { content: "\2713"; margin-left: 2px; font-size: 9px; color: var(--accent-ink); }
.dev input { width: 76px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 12px; padding: 0 6px; -webkit-user-select: text; user-select: text; touch-action: auto; }
.dev .note { font-size: 11.5px; color: var(--ink-2); margin: 2px 0; }
/* keep the hidden dev sheet's upward shadow fully below the viewport */
.sheet.dev:not(.show) { transform: translate(-50%, calc(105% + 64px)); }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <span class="pid" id="pid" role="button" aria-label="DEV puzzle menu"></span>
    <div class="dead" id="dead" role="status" aria-live="polite"><span class="msg">Something went wrong earlier</span></div>
    <div class="stat"><span class="lbl">Mistakes</span><span class="num" id="mist">0</span></div>
    <div class="status" id="status"></div>
    <div class="hbtns">
      <div class="hbtn" id="tokenBtn" role="button" aria-label="Progress token">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3"/><path d="m16 7 3 3"/><path d="m18.5 4.5 2 2"/></svg>
      </div>
      <div class="hbtn" id="resetBtn" role="button" aria-label="Restart puzzle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </div>
      <div class="hbtn" id="muteBtn" role="button" aria-label="Toggle sound">
        <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
      </div>
    </div>
  </header>

  <main class="board-wrap">
    <div class="board" id="board" aria-label="Sudoku board"></div>
    <div class="toast" id="toast" role="dialog" aria-live="polite">
      <h2 id="toastTitle">Solved</h2>
      <p id="toastMsg"></p>
      <div class="key mod" id="againKey" role="button">
        <div class="shadow"></div><div class="wall"></div>
        <div class="cap"><span class="lbl">Play again</span></div>
      </div>
    </div>
  </main>

  <section class="pad" id="pad" aria-label="Number pad"></section>
</div>
<canvas class="fxc" id="fxc" aria-hidden="true"></canvas>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Progress token">
  <h2>Progress token</h2>
  <p class="sub">Copy this code to move your progress to another browser or device. Paste a code below to load it. Your progress also saves automatically on this device.</p>
  <label for="tokOut">Your token</label>
  <textarea id="tokOut" readonly spellcheck="false"></textarea>
  <div class="row">
    <div class="key mod" id="copyKey" role="button"><div class="shadow"></div><div class="wall"></div><div class="cap"><span class="lbl">Copy</span></div></div>
  </div>

function parseGrid(str) {
  const clean = String(str).replace(/\s+/g, '');
  if (clean.length !== 81) throw new Error(`grid string must have 81 cells, got ${clean.length}`);
  const v = new Int8Array(81);
  for (let i = 0; i < 81; i++) {
    const ch = clean[i];
    v[i] = ch >= '1' && ch <= '9' ? ch.charCodeAt(0) - 48 : 0;
  }
  return v;
}

/** values -> 81-char string with '0' for empty cells. */
const gridToString = (values) => Array.from(values, (d) => (d ? String(d) : '0')).join('');

/** Mask of digits already placed among the peers of cell i. */
function seenMask(values, i) {
  let m = 0;
  for (const j of peers[i]) if (values[j]) m |= bit(values[j]);
  return m;
}

/** True if some peer of cell i holds digit d. */
function sees(values, i, d) {
  for (const j of peers[i]) if (values[j] === d) return true;
  return false;
}

/** Candidates from scratch: each empty cell gets every digit not seen by a peer. */
function computeCands(values) {
  const cands = new Uint16Array(81);
  for (let i = 0; i < 81; i++) if (!values[i]) cands[i] = ALL & ~seenMask(values, i);
  return cands;
}

/** Sorted list of cells whose digit also appears in one of their peers. */
function findConflicts(values) {
  const bad = new Set();
  for (const unit of units) {
    const where = new Array(10);
    for (const i of unit) {
      const d = values[i];
      if (!d) continue;
      if (where[d] === undefined) where[d] = i;
      else {
        bad.add(where[d]);
        bad.add(i);
      }
    }
  }
  return [...bad].sort((a, b) => a - b);
}

/** 81 integer entries in 0..9 and no two equal digits among peers. */
function isValidGrid(values) {
  if (!values || values.length !== 81) return false;
  for (let i = 0; i < 81; i++) {
    const d = values[i];
    if (!Number.isInteger(d) || d < 0 || d > 9) return false;
  }
  return findConflicts(values).length === 0;
}

/**
 * True if the board (values only) can no longer be completed by the basic
 * rules: a conflict, an empty cell with no candidate, or a unit where some
 * missing digit has no possible cell. Uses computeCands, not player notes.
 */
function isDeadEnd(values) {
  if (findConflicts(values).length) return true;
  const cands = computeCands(values);
  for (let i = 0; i < 81; i++) if (!values[i] && !cands[i]) return true;
  for (const unit of units) {
    let placed = 0;
    let possible = 0;
    for (const i of unit) {
      if (values[i]) placed |= bit(values[i]);
      else possible |= cands[i];
    }
    if ((placed | possible) !== ALL) return true;
  }
  return false;
}

// ===========================================================================
// 5. Techniques
//
// Each technique is a generator that yields every step it can find, in a
// fixed scan order (units: rows, then columns, then boxes; digits 1..9;
// cells in reading order). nextStep() takes the first step of the easiest
// technique that has one, so results are reproducible.
// Generators only read values/cands; they never mutate them.
// ===========================================================================

const TECHNIQUES = [
  'full-house',
  'hidden-single-box',
  'hidden-single-line',
  'naked-single',
  'pointing',
  'claiming',
  'naked-pair',
  'hidden-pair',
];

const TECH_INFO = {
  'full-house': { name: 'Full House', world: 0 },
  'hidden-single-box': { name: 'Hidden Single (box)', world: 1 },
  'hidden-single-line': { name: 'Hidden Single (row/column)', world: 1 },
  'naked-single': { name: 'Naked Single', world: 2 },
  pointing: { name: 'Pointing', world: 3 },
  claiming: { name: 'Claiming', world: 3 },
  'naked-pair': { name: 'Naked Pair', world: 4 },
  'hidden-pair': { name: 'Hidden Pair', world: 4 },
};

const TECH_RANK = Object.fromEntries(TECHNIQUES.map((t, k) => [t, k]));

function makeStep(tech, u, pattern, digits, place, eliminate, text) {
  return {
    tech,
    unit: u === null ? null : unitInfo(u),
    pattern,
    digits,
    place,
    eliminate,
    text,
  };
}

const sortElims = (elims) => elims.sort((a, b) => a[0] - b[0] || a[1] - b[1]);

// --- 5.1 Full house -------------------------------------------------------
// A unit with exactly one empty cell: it gets the one digit the unit is missing.
function* fullHouse(values, cands) {
  for (let u = 0; u < 27; u++) {
    let empty = -1;
    let count = 0;
    let placed = 0;
    for (const i of units[u]) {
      if (values[i]) placed |= bit(values[i]);
      else {
        empty = i;
        count++;
      }
    }
    if (count !== 1) continue;
    const missing = ALL & ~placed;
    if (popcount(missing) !== 1) continue; // unit has a duplicate: broken board
    const d = firstDigit(missing);
    if (!(cands[empty] & bit(d))) continue; // contradiction in cands: not a safe step
    const name = unitName(unitInfo(u));
    yield makeStep('full-house', u, [empty], [d], { cell: empty, digit: d }, [],
      `${cap(name)} has only one empty cell left, ${cellName(empty)}, and the only digit it is missing is ${d}.`);
  }
}

const cap = (s) => s[0].toUpperCase() + s.slice(1);

// --- 5.2/5.3 Hidden singles ----------------------------------------------
// Within one unit, digit d has exactly one cell left where it can go.
function* hiddenSingles(values, cands, uFrom, uTo, tech) {
  for (let u = uFrom; u < uTo; u++) {
    const cells = units[u];
    let placed = 0;
    for (const i of cells) if (values[i]) placed |= bit(values[i]);
    for (let d = 1; d <= 9; d++) {
      if (placed & bit(d)) continue;
      const b = bit(d);
      let spot = -1;
      let count = 0;
      for (const i of cells) {
        if (!values[i] && cands[i] & b) {
          spot = i;
          if (++count > 1) break;
        }
      }
      if (count !== 1) continue;
      const info = unitInfo(u);
      const name = unitName(info);
      // Explain why the other cells are out: do they all simply see a d?
      const others = cells.filter((i) => !values[i] && i !== spot);
      const allSee = others.every((i) => sees(values, i, d));
      const where = info.type === 'box' ? 'row or column' : info.type === 'row' ? 'column or box' : 'row or box';
      let why;
      if (others.length === 0) why = '';
      else if (allSee) why = ` Every other empty cell in ${name} already sees a ${d} in its ${where}.`;
      else why = ` Every other empty cell in ${name} has been ruled out for ${d}.`;
      yield makeStep(tech, u, [spot], [d], { cell: spot, digit: d }, [],
        `In ${name}, ${cellName(spot)} is the only place left for a ${d}.${why}`);
    }
  }
}

// --- 5.4 Naked single ------------------------------------------------------
// A cell with exactly one candidate.
function* nakedSingle(values, cands) {
  for (let i = 0; i < 81; i++) {
    if (values[i] || popcount(cands[i]) !== 1) continue;
    const d = firstDigit(cands[i]);
    const fromValues = (ALL & ~seenMask(values, i)) === cands[i];
    const why = fromValues
      ? `every other digit already appears in its row, column or box`
      : `all its other candidates have been ruled out`;
    yield makeStep('naked-single', null, [i], [d], { cell: i, digit: d }, [],
      `${cellName(i)} can only be ${d}: ${why}.`);
  }
}

// --- 5.5 Pointing ----------------------------------------------------------
// In a box, every candidate for d lies in one row (or column). The box's d
// must be in that line, so no other cell of the line (outside the box) can be d.
function* pointing(values, cands) {
  for (let b = 0; b < 9; b++) {
    const cells = BOXES[b];
    for (let d = 1; d <= 9; d++) {
      const m = bit(d);
      const pos = cells.filter((i) => !values[i] && cands[i] & m);
      if (pos.length < 2) continue; // 1 = hidden single, 0 = contradiction
      if (cells.some((i) => values[i] === d)) continue;
      for (const lineType of ['row', 'col']) {
        const key = lineType === 'row' ? rowOf : colOf;
        const k = key(pos[0]);
        if (!pos.every((i) => key(i) === k)) continue;
        const line = lineType === 'row' ? ROWS[k] : COLS[k];
        const elims = line.filter((i) => boxOf(i) !== b && !values[i] && cands[i] & m).map((i) => [i, d]);
        if (!elims.length) continue;
        const lineName = unitName({ type: lineType, index: k });
        yield makeStep('pointing', 18 + b, pos, [d], null, elims,
          `In box ${b + 1}, ${d} can only go in ${listCells(pos, 'or')}, ${allIn(pos.length)} ${lineName}. ` +
          `So the ${d} for ${lineName} must be inside box ${b + 1}: remove ${elimText(elims)}.`);
      }
    }
  }
}

// --- 5.6 Claiming (box-line reduction) ------------------------------------
// In a row/column, every candidate for d lies in one box. The line's d must
// be in that box, so no other cell of the box (off the line) can be d.
function* claiming(values, cands) {
  for (let u = 0; u < 18; u++) {
    const cells = units[u];
    for (let d = 1; d <= 9; d++) {
      const m = bit(d);
      const pos = cells.filter((i) => !values[i] && cands[i] & m);
      if (pos.length < 2) continue;
      if (cells.some((i) => values[i] === d)) continue;
      const b = boxOf(pos[0]);
      if (!pos.every((i) => boxOf(i) === b)) continue;
      const inLine = new Set(cells);
      const elims = BOXES[b].filter((i) => !inLine.has(i) && !values[i] && cands[i] & m).map((i) => [i, d]);
      if (!elims.length) continue;
      const lineName = unitName(unitInfo(u));
      yield makeStep('claiming', u, pos, [d], null, elims,
        `In ${lineName}, ${d} can only go in ${listCells(pos, 'or')}, ${allIn(pos.length)} box ${b + 1}. ` +
        `So the ${d} for box ${b + 1} must be in ${lineName}: remove ${elimText(elims)}.`);
    }
  }
}

// --- 5.7 Naked pair --------------------------------------------------------
// Two cells in a unit with the same two candidates {a,b}: those two cells take
// a and b between them, so every other cell in every unit they share loses a, b.
function sharedUnits(i, j) {
  return CELL_UNITS[i].filter((u) => CELL_UNITS[j].includes(u));
}

/** Eliminations of a naked pair, grouped by shared unit (only units with any). */
function nakedPairElims(values, cands, i, j, mask) {
  const perUnit = [];
  const seen = new Set();
  const elims = [];
  for (const u of sharedUnits(i, j)) {
    let any = false;
    for (const k of units[u]) {
      if (k === i || k === j || values[k] || !(cands[k] & mask)) continue;
      any = true;
      for (const d of digitsOf(cands[k] & mask)) {
        const key = k * 10 + d;
        if (!seen.has(key)) {
          seen.add(key);
          elims.push([k, d]);
        }
      }
    }
    if (any) perUnit.push(u);
  }
  return { perUnit, elims: sortElims(elims) };
}

function* nakedPair(values, cands) {
  const done = new Set();
  for (let u = 0; u < 27; u++) {
    const cells = units[u].filter((i) => !values[i] && popcount(cands[i]) === 2);
    for (let x = 0; x < cells.length; x++) {
      for (let y = x + 1; y < cells.length; y++) {
        const i = cells[x];
        const j = cells[y];
        if (cands[i] !== cands[j]) continue;
        const key = i * 81 + j;
        if (done.has(key)) continue;
        done.add(key);
        const mask = cands[i];
        const { perUnit, elims } = nakedPairElims(values, cands, i, j, mask);
        if (!elims.length) continue;
        const ds = digitsOf(mask);
        const names = perUnit.map((v) => unitName(unitInfo(v)));
        yield makeStep('naked-pair', perUnit[0], [i, j], ds, null, elims,
          `${cellName(i)} and ${cellName(j)} can only be ${ds[0]} or ${ds[1]}, ` +
          `so no other cell in ${joinWords(names, 'or')} can be ${ds[0]} or ${ds[1]}.`);
      }
    }
  }
}

// --- 5.8 Hidden pair -------------------------------------------------------
// In a unit, digits a and b each fit in only the same two cells. Those cells
// must hold a and b, so all their other candidates go.
function* hiddenPair(values, cands) {
  for (let u = 0; u < 27; u++) {
    const cells = units[u];
    let placed = 0;
    for (const i of cells) if (values[i]) placed |= bit(values[i]);
    // pos[d] = cells of this unit where d is a candidate (only for 2-spot digits)
    const two = [];
    const pos = new Array(10);
    for (let d = 1; d <= 9; d++) {
      if (placed & bit(d)) continue;
      const p = cells.filter((i) => !values[i] && cands[i] & bit(d));
      if (p.length === 2) {
        pos[d] = p;
        two.push(d);
      }
    }
    for (let x = 0; x < two.length; x++) {
      for (let y = x + 1; y < two.length; y++) {
        const a = two[x];
        const b = two[y];
        if (pos[a][0] !== pos[b][0] || pos[a][1] !== pos[b][1]) continue;
        const pair = pos[a];
        const keep = bit(a) | bit(b);
        const elims = [];
        for (const i of pair) for (const d of digitsOf(cands[i] & ~keep)) elims.push([i, d]);
        if (!elims.length) continue;
        const name = unitName(unitInfo(u));
        const extra = pair
          .filter((i) => cands[i] & ~keep)
          .map((i) => `${cellName(i)} loses ${joinWords(digitsOf(cands[i] & ~keep))}`);
        yield makeStep('hidden-pair', u, [...pair], [a, b], null, sortElims(elims),
          `In ${name}, ${a} and ${b} can only go in ${cellName(pair[0])} and ${cellName(pair[1])}, ` +
          `so those two cells must be ${a} and ${b}. Their other candidates go: ${joinWords(extra)}.`);
      }
    }
  }
}

const GENERATORS = {
  'full-house': fullHouse,
  'hidden-single-box': (v, c) => hiddenSingles(v, c, 18, 27, 'hidden-single-box'),
  'hidden-single-line': (v, c) => hiddenSingles(v, c, 0, 18, 'hidden-single-line'),
  'naked-single': nakedSingle,
  pointing,
  claiming,
  'naked-pair': nakedPair,
  'hidden-pair': hiddenPair,
};

// ===========================================================================
// 6. Step API: nextStep, allSteps, applyStep
// ===========================================================================

function toSet(allowed) {
  if (allowed instanceof Set) return allowed;
  return new Set(allowed ?? TECHNIQUES);
}

/**
 * Easiest available step among `allowed` techniques (array or Set of ids),
 * or null if none applies. Does not mutate values or cands.
 */
function nextStep(values, cands, allowed = TECHNIQUES) {
  const set = toSet(allowed);
  for (const tech of TECHNIQUES) {
    if (!set.has(tech)) continue;
    const r = GENERATORS[tech](values, cands).next();
    if (!r.done) return r.value;
  }
  return null;
}

/**
 * Every available step, easiest technique first, in scan order within each
 * technique. Useful for hints ("show me all pointing moves") and for checking
 * claims. Lazy: stop iterating whenever you like.
 */
function* allSteps(values, cands, allowed = TECHNIQUES) {
  const set = toSet(allowed);
  for (const tech of TECHNIQUES) if (set.has(tech)) yield* GENERATORS[tech](values, cands);
}

/**
 * Apply a step in place. Placement: set the value, clear its cands, and
 * remove the digit from every peer. Elimination: clear the listed bits.
 */
function applyStep(values, cands, step) {
  if (step.place) {
    const { cell, digit } = step.place;
    values[cell] = digit;
    cands[cell] = 0;
    const m = ~bit(digit);
    for (const j of peers[cell]) cands[j] &= m;
  }
  for (const [cell, digit] of step.eliminate || []) cands[cell] &= ~bit(digit);
}

// ===========================================================================
// 7. Logical solving and rating
// ===========================================================================

/**
 * Solve with human techniques only. Works on copies.
 * Returns { solved, steps, values } where values is a plain array.
 * A board with conflicts returns immediately with no steps.
 */
function solveLogically(values, allowed = TECHNIQUES) {
  const v = Int8Array.from(values);
  const set = toSet(allowed);
  const steps = [];
  if (findConflicts(v).length) return { solved: false, steps, values: Array.from(v) };
  const c = computeCands(v);
  // Each step places a digit or removes at least one candidate, so 81 + 729
  // steps is a hard upper bound; the guard only protects against bugs.
  for (let guard = 0; guard < 810; guard++) {
    const step = nextStep(v, c, set);
    if (!step) break;
    applyStep(v, c, step);
    steps.push(step);
  }
  const solved = v.every((d) => d !== 0) && findConflicts(v).length === 0;
  return { solved, steps, values: Array.from(v) };
}

/**
 * Rate a puzzle with all techniques.
 * hardest = hardest technique used (even if unsolved; check `solved`), or
 * null if no step was needed/possible. counts = steps per technique.
 */
function rate(values) {
  const { solved, steps } = solveLogically(values);
  const counts = {};
  let hardest = null;
  for (const s of steps) {
    counts[s.tech] = (counts[s.tech] || 0) + 1;
    if (hardest === null || TECH_RANK[s.tech] > TECH_RANK[hardest]) hardest = s.tech;
  }
  return { solved, hardest, counts, steps: steps.length };
}

// ===========================================================================
// 8. Backtracking (uniqueness only — never used for teaching)
// ===========================================================================

/**
 * Core bitmask backtracker with MRV (most constrained cell first).
 * Returns {count, solution} where solution is the first one found.
 */
function backtrack(values, limit) {
  const grid = Int8Array.from(values);
  const rowM = new Uint16Array(9);
  const colM = new Uint16Array(9);
  const boxM = new Uint16Array(9);
  for (let i = 0; i < 81; i++) {
    const d = grid[i];
    if (!d) continue;
    if (d < 1 || d > 9) return { count: 0, solution: null };
    const m = bit(d);
    const r = rowOf(i), c = colOf(i), b = boxOf(i);
    if ((rowM[r] | colM[c] | boxM[b]) & m) return { count: 0, solution: null }; // duplicate
    rowM[r] |= m;
    colM[c] |= m;
    boxM[b] |= m;
  }
  const empties = [];
  for (let i = 0; i < 81; i++) if (!grid[i]) empties.push(i);
  const ER = empties.map(rowOf), EC = empties.map(colOf), EB = empties.map(boxOf);
  let count = 0;
  let solution = null;
  const n = empties.length;

  // empties[0..k-1] are filled; pick the best remaining cell and swap it to k.
  function search(k) {
    if (k === n) {
      count++;
      if (!solution) solution = Array.from(grid);
      return count >= limit;
    }
    let best = -1, bestFree = 0, bestPop = 10;
    for (let t = k; t < n; t++) {
      const free = ALL & ~(rowM[ER[t]] | colM[EC[t]] | boxM[EB[t]]);
      const p = POP[free];
      if (p < bestPop) {
        bestPop = p; best = t; bestFree = free;
        if (p <= 1) break;
      }
    }
    if (bestPop === 0) return false;
    swap(k, best);
    const cell = empties[k], r = ER[k], c = EC[k], b = EB[k];
    let free = bestFree;
    while (free) {
      const m = free & -free;
      free ^= m;
      rowM[r] |= m; colM[c] |= m; boxM[b] |= m;
      grid[cell] = 31 - Math.clz32(m) + 1;
      const stop = search(k + 1);
      rowM[r] ^= m; colM[c] ^= m; boxM[b] ^= m;
      grid[cell] = 0;
      if (stop) { swap(k, best); return true; }
    }
    swap(k, best);
    return false;
  }
  function swap(a, b) {
    if (a === b) return;
    [empties[a], empties[b]] = [empties[b], empties[a]];
    [ER[a], ER[b]] = [ER[b], ER[a]];
    [EC[a], EC[b]] = [EC[b], EC[a]];
    [EB[a], EB[b]] = [EB[b], EB[a]];
  }
  search(0);
  return { count, solution };
}

/** Number of solutions, capped at `limit` (0, 1, ... limit). */
function countSolutions(values, limit = 2) {
  return backtrack(values, Math.max(1, limit)).count;
}

/** First solution found by backtracking (plain array), or null. */
function findSolution(values) {
  return backtrack(values, 1).solution;
}

/** The solution if it is unique, else null. */
function uniqueSolution(values) {
  const r = backtrack(values, 2);
  return r.count === 1 ? r.solution : null;
}

// ===========================================================================
// 9. "Check my thinking"
// ===========================================================================

const yes = (text) => ({ ok: true, text });
const no = (text) => ({ ok: false, text });

/** Positions of digit d (as candidates in empty cells) within unit u. */
const positionsIn = (values, cands, u, d) => units[u].filter((i) => !values[i] && cands[i] & bit(d));
const unitHas = (values, u, d) => units[u].some((i) => values[i] === d);
const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));

/**
 * Check a player's claim against the current board.
 *   {type:'pattern', tech, cells, digits?}  tech: naked-pair | hidden-pair |
 *       pointing | claiming | naked-single | hidden-single
 *   {type:'place', cell, digit}
 *   {type:'eliminate', cell, digit}
 * `solution` (81 digits) is optional; if missing it is computed when the
 * board has a unique solution. Returns {ok, text}.
 */
function checkClaim(values, cands, claim, solution) {
  if (!claim || typeof claim !== 'object') return no('I could not understand that claim.');
  if (claim.type === 'pattern') return checkPattern(values, cands, claim);
  if (claim.type === 'place' || claim.type === 'eliminate') {
    const { cell, digit } = claim;
    if (!(cell >= 0 && cell < 81) || !(digit >= 1 && digit <= 9)) return no('That cell or digit is out of range.');
    if (values[cell]) return no(`${cellName(cell)} is already filled (${values[cell]}).`);
    const sol = solution ?? uniqueSolution(values);
    return claim.type === 'place'
      ? checkPlace(values, cands, cell, digit, sol)
      : checkEliminate(values, cands, cell, digit, sol);
  }
  return no('I could not understand that claim.');
}

/** Why d is not a candidate in cell i: a peer holds it, or it was ruled out. */
function whyNot(values, i, d) {
  for (const j of peers[i]) {
    if (values[j] !== d) continue;
    const u = CELL_UNITS[i].find((v) => CELL_UNITS[j].includes(v));
    return `${cellName(j)} in the same ${UNIT_WORDS[unitInfo(u).type]} is already ${d}`;
  }
  return `${d} has already been ruled out there`;
}

/** If the board forces d into cell i with a single, say how; else null. */
function forcedBy(values, cands, i, d) {
  if (cands[i] === bit(d)) return `it is the only candidate left in ${cellName(i)}`;
  for (const u of [CELL_UNITS[i][2], CELL_UNITS[i][0], CELL_UNITS[i][1]]) {
    const p = positionsIn(values, cands, u, d);
    if (p.length === 1 && p[0] === i) return `it is the only place for a ${d} in ${unitName(unitInfo(u))}`;
  }
  return null;
}

function checkPlace(values, cands, cell, d, sol) {
  const name = cellName(cell);
  const isCand = !!(cands[cell] & bit(d));
  if (sol) {
    if (sol[cell] === d) {
      const why = forcedBy(values, cands, cell, d);
      if (why) return yes(`Yes, ${name} is ${d}, and the board already proves it: ${why}.`);
      return yes(`Yes, ${name} is ${d}. But nothing on the board forces it with a single yet, so look for what pins it down.`);
    }
    if (!isCand) return no(`No, ${name} can't be ${d}: ${whyNot(values, cell, d)}.`);

/* ---- src/puzzles.js ---- */
const __m_puzzles = (() => {
const { DATA } = __m_puzzles_data;
const { parseGrid, computeCands, findSolution } = __m_solver;
const { decodeCands, BANDS, dailyIndex } = __m_shared;
// puzzles.js — the shipped puzzle stock (data/puzzles.json, embedded by the
// build as the virtual module './puzzles-data.js'), lookup by id, and the
// board a puzzle starts from.




/* The feel prototype's fixed puzzle, for the parity test (#p=proto). DEV only. */
const PROTO = {
  id: 'proto',
  givens: '530070000600195000098000060800060003400803001700020006060000280000419005000080079',
  solution: '534678912672195348198342567859761423426853791713924856961537284287419635345286179'
};

const SPOT_LABEL = ['full house', 'hidden single', 'naked single', 'pointing / claiming', 'pair'];

const byId = new Map();     // id -> { item, kind, world, band, index, list }
function add(list, kind, extra) {
  list.forEach((item, index) => byId.set(item.id, { item, kind, index, list, ...extra }));
}
add([PROTO], 'proto', {});
for (const w of DATA.worlds) {
  add(w.spotIt, 'spotIt', { world: w.world });
  add(w.useIt, 'useIt', { world: w.world });
  add(w.master, 'master', { world: w.world });
}
for (const b of BANDS) add(DATA.quick[b] || [], 'quick', { band: b });
add(DATA.daily, 'daily', {});

const has = id => byId.has(id);
const entry = id => byId.get(id) || null;
const allIds = () => [...byId.keys()].filter(id => id !== 'proto');
const worlds = DATA.worlds;
const quick = DATA.quick;
const daily = DATA.daily;
const todayDailyId = (date) => DATA.daily[dailyIndex(date) % DATA.daily.length].id;

const toArr = s => Int8Array.from(parseGrid(s));

/* Solution of an item: stored, or found again (solutionsOmitted), or for a
   Spot it snapshot, the solution of the puzzle it was taken from. */
function solutionOf(id) {
  const e = entry(id);
  if (!e) return null;
  if (e.kind === 'spotIt') return solutionOf(e.item.source);
  if (e.item.solution) return toArr(e.item.solution);
  const s = findSolution(parseGrid(e.item.givens));
  return s ? Int8Array.from(s) : null;
}

/* Everything game.js needs to start a puzzle:
   { id, mode, kind, world, given, values, notes, sol, step?, label? } */
function boardFor(id) {
  const e = entry(id);
  if (!e) return null;
  const sol = solutionOf(id);
  if (e.kind === 'spotIt') {
    const values = toArr(e.item.values);
    const notes = e.item.cands ? decodeCands(e.item.cands) : computeCands(values);
    return { id, mode: 'spot', kind: e.kind, world: e.world, given: values.slice(), values, notes, sol, step: e.item.step, label: SPOT_LABEL[e.world] };
  }
  const given = toArr(e.item.givens);
  return { id, mode: 'free', kind: e.kind, world: e.world ?? -1, given, values: given.slice(), notes: new Uint16Array(81), sol };
}

/* Next item in the same list (wraps), for the Next keycap. */
function nextId(id) {
  const e = entry(id);
  if (!e) return null;
  return e.list[(e.index + 1) % e.list.length].id;
}

function modeLabel(id) {
  const e = entry(id);
  if (!e) return '';
  switch (e.kind) {
    case 'spotIt': return `W${e.world} Spot it`;
    case 'useIt': return `W${e.world} Use it`;
    case 'master': return `W${e.world} Master`;
    case 'quick': return `Quick ${e.band}`;
    case 'daily': return `Daily ${e.item.band}`;
    default: return 'Prototype';
  }
}
return Object.freeze({ PROTO, has, entry, allIds, worlds, quick, daily, todayDailyId, solutionOf, boardFor, nextId, modeLabel });
})();

/* ---- src/game.js ---- */
const __m_game = (() => {
const { $ } = __m_util;
const { sfx } = __m_audio;
const { S, spotSteps } = __m_state;
const { markGivens } = __m_board;
const { resetGame } = __m_actions;
const { bindPress } = __m_input;
const { flushSave, loadSaved } = __m_token;
const { boardFor, nextId, modeLabel, has } = __m_puzzles;
// game.js — puzzle sessions: start / switch puzzles (free play or Spot it),
// restore the per-id autosave, the Next / Play again keycap.









const pidEl = $('pid');
const LAST_KEY = 'sudoku.last';

function updatePid() {
  pidEl.innerHTML = `<b>DEV</b> · ${S.id} · ${modeLabel(S.id)}`;
}

/* Start (or switch to) a puzzle. `restore`: load this id's autosave if any. */
function startPuzzle(id, restore = true) {
  const b = boardFor(id);
  if (!b || !b.sol) return false;
  if (S.id && S.id !== id) flushSave();          // keep the puzzle we are leaving
  S.id = id; S.mode = b.mode; S.kind = b.kind; S.world = b.world;
  S.given.set(b.given); S.sol.set(b.sol); S.startNotes.set(b.notes);
  S.spot = b.mode === 'spot'
    ? { steps: spotSteps(b.values, b.notes, b.world), erased: new Set(), found: null, label: b.label, step: b.step }
    : null;
  markGivens();
  resetGame();
  if (restore) loadSaved();
  updatePid();
  try { localStorage.setItem(LAST_KEY, id); } catch (e) {}
  return true;
}

/* Puzzle to open at boot: #p=<id>, else the last one played, else the first gentle Quick Play. */
function initialId() {
  const m = /[#&]p=([\w-]+)/.exec(location.hash);
  if (m && has(m[1])) return m[1];
  try { const last = localStorage.getItem(LAST_KEY); if (last && has(last)) return last; } catch (e) {}
  return 'q-gentle-001';
}

function initGame() {
  // Toast keycap: "Play again" after a solve, "Next" after a Spot it
  bindPress($('againKey'), () => {
    sfx.mod();
    if (S.mode === 'spot' && S.solved) startPuzzle(nextId(S.id));
    else resetGame();
  });
  window.addEventListener('hashchange', () => {
    const m = /[#&]p=([\w-]+)/.exec(location.hash);
    if (m && has(m[1]) && m[1] !== S.id) startPuzzle(m[1]);
  });
}
return Object.freeze({ updatePid, startPuzzle, initialId, initGame });
})();

/* ---- src/devmenu.js ---- */
const __m_devmenu = (() => {
const { $ } = __m_util;
const { sfx } = __m_audio;
const { S, UI } = __m_state;
const { release } = __m_actions;
const { cancelAllPresses, bindHeaderBtn } = __m_input;
const { openSheet } = __m_token;
const { startPuzzle } = __m_game;
const { worlds, quick, daily, todayDailyId, modeLabel, entry } = __m_puzzles;
const { BANDS, dailyIndex, DAILY_EPOCH } = __m_shared;
// devmenu.js — TEMPORARY developer menu (clearly marked DEV). A sheet that
// reuses the token sheet styling: campaign worlds 0-4 (Spot it 1-12, Use it
// 1-12, Master 1-4), Quick Play bands, today's Daily, the progress token.
// Remove this module (and the #pid / #devSheet markup) for release.










const sheet = $('devSheet'), bg = $('devBg');

function el(tag, cls, text, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function chip(parent, label, id, title) {
  const c = el('span', 'chip', label, parent);
  c.setAttribute('role', 'button');
  if (id) { c.dataset.id = id; if (id === S.id) c.classList.add('cur'); }
  if (title) c.title = title;
  return c;
}
const pad2 = n => String(n).padStart(2, '0');

function go(id) { closeDev(); if (id && id !== S.id) startPuzzle(id); }

function render() {
  sheet.textContent = '';
  const h = el('h2', null, null, sheet); h.innerHTML = '<b>DEV</b> · Puzzles';
  el('p', 'sub', `Current: ${S.id} · ${modeLabel(S.id)}${S.mode === 'spot' ? ' · target: ' + S.spot.label : ''}`, sheet);

  el('div', 'grp', 'Campaign', sheet);
  for (const w of worlds) {
    for (const [key, name] of [['spotIt', 'Spot it'], ['useIt', 'Use it'], ['master', 'Master']]) {
      const row = el('div', 'wrow grid', null, sheet);
      el('span', 'tag', `W${w.world} ${name}`, row);
      w[key].forEach((it, k) => chip(row, String(k + 1), it.id, it.id));
    }
  }

  el('div', 'grp', 'Quick Play', sheet);
  for (const b of BANDS) {
    const row = el('div', 'wrow', null, sheet);
    el('span', 'tag', b, row);
    const list = quick[b] || [];
    const r = chip(row, 'Random');
    r.addEventListener('click', () => go(list[(Math.random() * list.length) | 0].id));
    const inp = el('input', null, null, row);
    inp.type = 'number'; inp.min = 1; inp.max = list.length; inp.placeholder = `1-${list.length}`;
    const g = chip(row, 'Go');
    g.addEventListener('click', () => { const n = +inp.value; if (n >= 1 && n <= list.length) go(list[n - 1].id); });
  }

  el('div', 'grp', 'Daily', sheet);
  const today = new Date(), idx = dailyIndex(today), tid = todayDailyId(today);
  el('p', 'note', `Today (${today.getFullYear()}-${pad2(today.getMonth() + 1)}-${pad2(today.getDate())}, local) = day ${idx} → ${tid} (${entry(tid).item.band}). Day 0 = Monday ${DAILY_EPOCH[0]}-${pad2(DAILY_EPOCH[1])}-${pad2(DAILY_EPOCH[2])}, index = days since then mod ${daily.length}.`, sheet);
  const drow = el('div', 'wrow', null, sheet);
  chip(drow, 'Play today', tid);
  const dinp = el('input', null, null, drow);
  dinp.type = 'number'; dinp.min = 0; dinp.max = daily.length - 1; dinp.placeholder = `0-${daily.length - 1}`;
  const dg = chip(drow, 'Go');
  dg.addEventListener('click', () => { const n = +dinp.value; if (dinp.value !== '' && n >= 0 && n < daily.length) go(daily[n].id); });

  el('div', 'grp', 'Other', sheet);
  const orow = el('div', 'wrow', null, sheet);
  const tk = chip(orow, 'Progress token');
  tk.addEventListener('click', () => { closeDev(); openSheet(); });
  chip(orow, 'Prototype puzzle', 'proto');
  const close = chip(orow, 'Close');
  close.addEventListener('click', closeDev);

  sheet.querySelectorAll('.chip[data-id]').forEach(c => c.addEventListener('click', () => go(c.dataset.id)));
}

function openDev() {
  cancelAllPresses(); release();
  render();
  UI.sheetOpen = true; sheet.classList.add('show'); bg.classList.add('show');
  sheet.scrollTop = 0;
}
function closeDev() {
  UI.sheetOpen = false; sheet.classList.remove('show'); bg.classList.remove('show');
  const a = document.activeElement; if (a && a.blur) a.blur();
}

function initDevMenu() {
  bindHeaderBtn($('pid'), () => { sfx.mod(); openDev(); });
  bg.addEventListener('pointerdown', e => { e.preventDefault(); closeDev(); });
}
return Object.freeze({ openDev, closeDev, initDevMenu });
})();
