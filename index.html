/* =========================================================================
   FREE MODE (freemode.css, appended after keys.css by the build)
   Screen: Daily card on top, Quick Play band keycaps below, the Free Mode
   feedback setting. Keys are real .key elements (settings.js dresses them),
   so they follow the player's keycap style and colorway. Plates use the
   colorway's --plate (fallback --line when the classic debug look is on).
   ========================================================================= */
.fm {
  position: fixed; inset: 0; z-index: 31; background: var(--bg); color: var(--ink);
  opacity: 0; visibility: hidden; transform: translate3d(0, 10px, 0); pointer-events: none;
  transition: opacity 200ms ease-out, transform 280ms cubic-bezier(.2,.8,.25,1), visibility 0s 280ms;
}
.fm.show { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition: opacity 200ms ease-out, transform 280ms cubic-bezier(.2,.8,.25,1), visibility 0s; }
.fm-in {
  height: 100%; max-width: 500px; margin: 0 auto; display: flex; flex-direction: column;
  padding:
    max(env(safe-area-inset-top), 8px)
    max(env(safe-area-inset-right), 14px)
    0
    max(env(safe-area-inset-left), 14px);
}
.fm-top { flex: none; height: 48px; display: flex; align-items: center; gap: 12px; }
.fm-top h1 { margin: 0; font-size: 21px; font-weight: 760; letter-spacing: -.01em; }
.fm .key { touch-action: pan-y; }
.fm .key:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
.fm-back { --kh: 36px; width: 86px; flex: none; }
.fm-back .cap { grid-auto-flow: column; grid-template-rows: none !important; justify-content: center; align-items: center; gap: 3px; }
.fm-back svg { width: 16px; height: 16px; }
.fm-back .lbl { font-size: 12.5px !important; font-weight: 680; color: var(--cap-ink); }

.fm-scroll {
  flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  margin: 0 -14px; padding: 6px 14px max(env(safe-area-inset-bottom), 16px);
  display: flex; flex-direction: column; gap: 16px;
}

/* ---- shared plate (the pad's plate, smaller) ---- */
.fm-week, .fm-bands {
  position: relative; isolation: isolate; border-radius: 15px;
  background: linear-gradient(165deg, rgba(255,255,255,.14), rgba(0,0,0,.06)), var(--plate, var(--line));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  .fm-week, .fm-bands { box-shadow: inset 0 1px 0 rgba(255,255,255,.05), inset 0 -2px 0 rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.03); }
}

/* ---- Daily card ---- */
.fm-card {
  background: var(--surface); border-radius: 20px; padding: 14px 14px 12px;
  box-shadow: 0 0 0 1px var(--line), 0 14px 30px -22px rgba(0,0,0,.35);
}
.fm-dhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.fm-eyebrow, .fm-fb h3 { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.fm-dtitle { margin-top: 2px; font-size: 18px; font-weight: 720; letter-spacing: -.005em; white-space: nowrap; }
.fm-streak { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px; border-radius: 13px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); }
.fm-sn { display: grid; line-height: 1; }
.fm-sn b { font-size: 19px; font-weight: 760; }
.fm-sn small { margin-top: 2px; font-size: 9.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }

/* the flame: an outline until lit */
.fm-flame { display: grid; place-items: center; width: 26px; height: 26px; transform-origin: 50% 85%; }
.fm-flame svg { width: 100%; height: 100%; overflow: visible; }
.fm-flame .fo { fill: transparent; stroke: var(--ink-3); stroke-width: 1.6; stroke-linejoin: round; transition: fill 200ms ease-out, stroke 200ms ease-out; }
.fm-flame .fi { fill: #ffd76a; opacity: 0; transition: opacity 200ms ease-out; }
.lit > .fm-flame .fo { fill: #ff7330; stroke: #f05a1a; }
.lit > .fm-flame .fi { opacity: 1; }
.lit > .fm-flame svg { filter: drop-shadow(0 1px 4px rgba(255, 110, 40, .45)); }

/* week strip: seven small keycaps on a plate */
.fm-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; padding: 6px 6px 8px; }
.fm-day { --kh: clamp(42px, 5.8dvh, 48px); }
.fm-day .cap { grid-template-rows: auto auto; align-content: center; gap: 1px; }
.fm-day .fm-wd { font-size: 9px; font-weight: 700; letter-spacing: .06em; opacity: .6; line-height: 1; }
.fm-day .lg { font-size: 15px !important; font-weight: 700 !important; line-height: 1; }
.fm-day .led { left: auto !important; right: calc(var(--kS, 0px) + 4px) !important; top: calc(var(--kB, 0px) + 4px) !important; width: 5px !important; height: 5px !important; }
.fm-day .fm-ck { position: absolute; right: calc(var(--kS, 0px) + 3px); top: calc(var(--kB, 0px) + 2px); width: 10px; height: 10px; display: none; }
.fm-day .fm-ck svg { width: 100%; height: 100%; display: block; }
.fm-day.late .fm-ck { display: block; opacity: .75; }
.fm-day.latched .lg { color: var(--accent-ink); }
/* today: a mark on the plate under the key */
.fm-day.today::after {
  content: ""; position: absolute; left: 50%; bottom: -6px; width: 14px; height: 3px; margin-left: -7px;
  border-radius: 2px; background: var(--accent);
}
.kx .fm-day.today::after { background: var(--led); box-shadow: 0 0 4px var(--led); }
/* future days: an empty slot on the plate */
.fm-day.future { cursor: default; }
.fm-day.future .shadow, .fm-day.future .wall { opacity: 0; }
.fm-day.future .cap { background: none; box-shadow: inset 0 0 0 1.5px var(--plate-line, var(--line-strong)); color: var(--plate-ink, var(--ink-3)); opacity: .7; }
.fm-day.future .cap::after { display: none; }
.kx .fm-day.future { --lg: var(--plate-ink); }
.kx .fm-day.future .sk, .kx .fm-day.future .tf, .kx .fm-day.future .sw { opacity: 0; }

.fm-dfoot { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.fm-dstatus { flex: 1; min-width: 0; display: grid; gap: 2px; }
.fm-dstatus .fm-dn { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.fm-dstatus .fm-ok { display: flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 720; color: var(--accent-ink); }
.fm-dstatus .fm-ok svg { width: 17px; height: 17px; }
.fm-dstatus small { font-size: 12.5px; font-weight: 650; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.fm-play { --kh: 46px; width: 132px; flex: none; }
/* the accent cap (same colorway slot as the Hint key) */
.kx .key.fm-play { --base: var(--cap-accent); --lg: var(--legend-accent); --lgl: var(--legend-accent); --veil: var(--veil-accent); --glf: var(--glf-accent); }
.fm-play .cap { grid-auto-flow: column; grid-template-rows: none; justify-content: center; align-items: center; gap: 7px; }
.fm-play svg { width: 17px; height: 17px; }
.fm-play .lbl { font-size: 14px; font-weight: 720; color: var(--cap-ink); }
.fm-next { margin-top: 10px; font-size: 11.5px; font-weight: 560; color: var(--ink-3); text-align: right; }

/* ---- Quick Play ---- */
.fm-qhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 2px 10px; }
.fm-qhead h2 { margin: 0; font-size: 18px; font-weight: 740; }
.fm-ch { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 620; color: var(--ink-2); cursor: pointer; }
.fm-ch .set-toggle { width: 44px; height: 26px; border-radius: 13px; }
.fm-ch .set-toggle i { width: 20px; height: 20px; }
.fm-ch .set-toggle[aria-checked="true"] i { transform: translateX(18px); }
.fm-warn {
  display: none; align-items: flex-start; gap: 8px; margin: -2px 0 10px; padding: 8px 10px; border-radius: 12px;
  background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-sel);
  font-size: 12px; line-height: 1.35; font-weight: 560; color: var(--ink-2);
}
.fm-warn.show { display: flex; animation: fm-in 220ms ease-out; }
.fm-warn svg { flex: none; width: 15px; height: 15px; margin-top: 1px; color: var(--accent-ink); }
@keyframes fm-in { from { opacity: 0; transform: translate3d(0, -4px, 0); } to { opacity: 1; transform: none; } }

.fm-bands { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 9px; padding: 8px 8px 10px; }
.fm-band { --kh: 56px; height: clamp(90px, 12.4dvh, 106px); }
.fm-band .cap {
  display: grid; grid-template-rows: auto auto 1fr; align-content: stretch; justify-items: start; place-items: initial;
  text-align: left; padding: 10px 12px 9px; color: var(--cap-ink);
}
.kx .fm-band .cap { padding: calc(var(--kB) + 8px) calc(var(--kS) + 10px) calc(var(--kF) + 6px); }
.fm-bn { font-size: 17px; font-weight: 760; line-height: 1.1; }
.kx .fm-bn { text-transform: var(--lbl-tt); letter-spacing: var(--lbl-ls); font-weight: var(--lbl-w); }
.kx.ks-sa .fm-bn { font-size: 15px; }
.fm-bneeds { margin-top: 2px; font-size: 11.5px; font-weight: 620; opacity: .66; white-space: nowrap; }
.fm-bstat { align-self: end; font-size: 11.5px; font-weight: 560; opacity: .8; white-space: nowrap; font-variant-numeric: tabular-nums; }
.fm-bstat b { font-weight: 760; }
.fm-band .led { left: auto !important; right: calc(var(--kS, 0px) + 10px) !important; top: calc(var(--kB, 0px) + 10px) !important; }
.fm-block {
  position: absolute; left: calc(var(--kS, 0px) + 10px); bottom: calc(var(--kF, 0px) + 6px);
  display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 680; opacity: 0; pointer-events: none;
}
.fm-block svg { width: 14px; height: 14px; overflow: visible; }
.fm-block .shackle { transform-box: fill-box; transform-origin: 100% 100%; }
.fm-band.locked { cursor: default; }
.fm-band.locked .fm-bn, .fm-band.locked .fm-bneeds { opacity: .42; }
.fm-band.locked .fm-bstat { opacity: 0; }
.fm-band.locked .fm-block { opacity: .8; }
.fm-band.locked .shadow { opacity: .6; }
/* the lock opens where it sits, then fades (Challenge me switched on) */
.fm-block.opening { animation: fm-unlock 560ms ease-out; }
.fm-block.opening .shackle { animation: fm-shackle 560ms cubic-bezier(.3,1.4,.5,1); }
@keyframes fm-unlock { 0%, 55% { opacity: .8; } 100% { opacity: 0; } }
@keyframes fm-shackle { 0% { transform: none; } 45%, 100% { transform: translate3d(0, -2.5px, 0) rotate(28deg); } }

/* ---- Free Mode feedback ---- */
.fm-fb h3 { margin: 4px 2px 8px; }
.fm-seg {
  position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
  padding: 3px; border-radius: 12px; background: var(--line);
}
.fm-seg button {
  appearance: none; border: 0; background: transparent; color: var(--ink-2); font: inherit;
  font-size: 12.5px; font-weight: 640; height: 36px; border-radius: 9px; cursor: pointer; padding: 0 2px;
  position: relative; z-index: 1; touch-action: manipulation; white-space: nowrap;
}
.fm-seg button[aria-checked="true"] { color: var(--ink); }
.fm-seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.fm-seg .thumb {
  position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 10px) / 3);
  border-radius: 9px; background: var(--surface);
  box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 2px 8px -2px rgba(0,0,0,.14);
  transform: translateX(calc(var(--i, 1) * (100% + 2px)));
  transition: transform 260ms cubic-bezier(.3,1.25,.5,1);
}
.fm-fbnote { margin: 8px 2px 0; min-height: 32px; font-size: 12px; line-height: 1.35; color: var(--ink-2); }

/* ---- game side: header button, toast streak row, embers ---- */
.fm-tstreak { display: none; align-items: center; justify-content: center; gap: 6px; margin: -6px 0 12px; }
.fm-tstreak.on { display: flex; }
.fm-tstreak .fm-flame { width: 24px; height: 24px; }
.fm-tstreak b { font-size: 17px; font-weight: 760; }
.fm-tstreak small { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.fm-embers { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.fm-ember {
  position: absolute; left: 0; top: 0; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
  background: radial-gradient(circle, #fff4c8 0%, #ffb23c 45%, #ff6a1f 80%);
  box-shadow: 0 0 8px 2px rgba(255, 140, 40, .5); opacity: 0; will-change: transform, opacity;
}

@media (prefers-reduced-motion: reduce) {
  .fm { transform: none; transition: opacity 120ms ease-out, visibility 0s 120ms; }
  .fm.show { transition: opacity 120ms ease-out, visibility 0s; }
  .fm-seg .thumb, .fm-flame .fo, .fm-flame .fi { transition-duration: 80ms; }
  .fm-warn.show { animation: none; }
}
/* =========================================================================
   STEP 9: BACKUP CODE SHEET (reuses .sheet), Settings row, Home link
   ========================================================================= */
.sheet.bk { max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain; padding-top: 14px; }
.sheet.bk h2 { display: flex; align-items: center; gap: 8px; }
.bk-ic { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; flex: none;
  background: var(--bg); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.bk-ic svg { width: 15px; height: 15px; display: block; }
.sheet.bk h2 .bk-ic.pop { animation: bkpop 520ms cubic-bezier(.3,1.5,.5,1); color: var(--accent-ink); }
@keyframes bkpop { 0% { transform: scale(1); } 30% { transform: scale(1.28); box-shadow: inset 0 0 0 1px var(--line), 0 0 0 6px color-mix(in srgb, var(--charge, #f5b400) 35%, transparent); } 100% { transform: scale(1); } }
.sheet.bk .sub { margin-bottom: 6px; }
.sheet.bk label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 8px; }
.sheet.bk .bk-meta { font-weight: 560; letter-spacing: 0; text-transform: none; color: var(--ink-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet.bk #tokOut { height: 96px; }
.sheet.bk #tokIn { height: 54px; }
.sheet.bk .msg { min-height: 17px; margin-top: 6px; line-height: 1.35; }
.sheet.bk .bk-undo { display: none; margin-top: 4px; }
.sheet.bk .bk-undo.show { display: flex; }
/* the load bolt flies from the Load key into the sheet's header: spark canvas above the sheet */
body.bk-fx .sparkc { z-index: 52; }
@media (max-height: 700px) {
  .sheet.bk { padding-top: 12px; }
  .sheet.bk .sub { font-size: 12px; }
  .sheet.bk #tokOut { height: 84px; }
  .sheet.bk #tokIn { height: 46px; }
  .sheet.bk .row .key { --kh: 40px; }
}
@media (prefers-reduced-motion: reduce) { .sheet.bk h2 .bk-ic.pop { animation-duration: 1ms; } }

/* Settings → Backup & restore */
.set-bk { appearance: none; width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 48px; cursor: pointer;
  border: 0; border-radius: 12px; background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font: inherit; text-align: left; }
.set-bk:active { transform: translateY(1px); }
.set-bk .bk-ic { background: var(--surface); }
.set-bk-t { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.set-bk-t b { font-size: 14px; font-weight: 600; }
.set-bk-t small { font-size: 11.5px; color: var(--ink-3); }
.set-bk-ch { font-size: 22px; line-height: 1; color: var(--ink-3); }

/* Home: a small link, top right */
.home-bk { appearance: none; border: 0; background: transparent; cursor: pointer; padding: 4px 6px; margin-right: -6px;
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.home-bk .bk-ic { width: 22px; height: 22px; border-radius: 7px; }
.home-bk .bk-ic svg { width: 13px; height: 13px; }
/* =========================================================================
   STEP 10 — EFFECTS PASS (effects.css, appended last by the build)
   Transform / opacity only. Every rule here serves an effect with a source
   (where the action happened) and a purpose (what its motion explains).
   ========================================================================= */

/* the slab: the tapped key's face growing into the next screen (morph.js) */
.mslab { position: fixed; left: 0; top: 0; display: none; pointer-events: none; transform-origin: 0 0; will-change: transform, opacity; }

/* charge meters: the delta grows with scaleX; the surge is an opacity flash of the hot core */
.cm-fill { transform-origin: 0 50%; }
.cm-fill::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--charge-hot); opacity: 0; pointer-events: none; }
.cm.surge .cm-fill { animation: none; }
.cm.surge .cm-fill::after { animation: cm-hot 700ms ease-out; }
@keyframes cm-hot { 0% { opacity: .55; } 100% { opacity: 0; } }

/* expertise segments: the fill is a scaled child (scaleX), not a width */
.xp-seg i::after { content: none; }
.xp-seg i > b { position: absolute; inset: 0; background: var(--ink); border-radius: inherit; transform-origin: 0 50%; transform: scaleX(var(--f)); }
.xp-lv b { display: inline-block; }

/* a charge cell waiting for its fill to land (the DOM is final, the paint waits) */
.cc.on.fx-wait .cc-fill { opacity: 0; transform: scaleY(.2); }
.cc.on.fx-wait .cc-body { stroke: var(--charge-line); }
.cc.on.fx-wait .cc-nub { fill: var(--charge-line); }
.cc.on.fx-wait .cc-bolt { fill: none; stroke: var(--charge-line); stroke-width: 1.2; }
.cc.on.fx-wait svg { filter: none; }
.cw-row .key.lt .pips3 .cc.on.fx-wait .cc-body, .cw-row .key.lt .pips3 .cc.on.fx-wait .cc-bolt { stroke: color-mix(in srgb, var(--lg) 42%, transparent); }
.cw-row .key.lt .pips3 .cc.on.fx-wait .cc-nub { fill: color-mix(in srgb, var(--lg) 42%, transparent); }

/* the open world's switch: its halo breathes twice when the map opens, then rests (no ambient loop) */
.kbd .key.wk.open > .sw .hs { animation: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 1px 0 rgba(255,255,255,.35); }
.kbd .key.wk.open > .sw .hs::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--charge) 60%, transparent), 0 0 12px var(--charge-glow);
  animation: sw-halo 1.6s ease-in-out 2;
}
@keyframes sw-halo { 50% { opacity: .3; } }

/* the Master tile before its lock pops off */
.cw-row .key.mt > .cap > * { transition: opacity 220ms ease-out; }
.cw-row .key.mt.fx-unlit > .cap > *:not(.m-pop) { opacity: .4; }
.m-pop { position: absolute; left: calc(var(--kS, 6px) + 12px); top: 50%; width: 18px; height: 18px; margin-top: -10px; pointer-events: none; z-index: 3; color: var(--lg, var(--cap-ink)); opacity: 1 !important; }
.m-pop svg { width: 100%; height: 100%; display: block; }

/* Free Mode: a day waiting for its ember, the lock closing again */
.fm-day.fx-wait.latched > .cap { transform: none; }
.fm-day.fx-wait .fm-ck, .fm-day.fx-wait .led { opacity: 0 !important; }
.fm-day.fx-wait.latched .lg { color: inherit; }
.kx .fm-day.fx-wait.latched .shadow { opacity: 1; }
.fm-sn b { display: inline-block; }
.fm-bstat b { display: inline-block; }
.fm-block.closing { animation: fm-lock 420ms ease-out; }
.fm-block.closing .shackle { animation: fm-shackle-close 420ms cubic-bezier(.3,1.4,.5,1); }
@keyframes fm-lock { 0% { opacity: 0; } 30%, 100% { opacity: .8; } }
@keyframes fm-shackle-close { 0%, 30% { transform: translate3d(0, -2.5px, 0) rotate(28deg); } 100% { transform: none; } }

/* Settings: a fresh unlock — the lock pops off the tile, the tile lights */
.set-pop { position: fixed; left: 0; top: 0; z-index: 60; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; display: grid; place-items: center; pointer-events: none;
  background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.2), 0 0 0 1px var(--line); }
.set-pop svg { width: 13px; height: 13px; }
.set-glow { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
  box-shadow: inset 0 0 0 2px var(--charge), 0 0 14px var(--charge-glow); opacity: 0; }
.set-tile.fx-wait .set-mk > .key, .set-swatch.fx-wait .set-mini > .key { opacity: .38; filter: saturate(.3); }

/* Backup: the code box acknowledges what was copied */
.bk-ack { position: absolute; pointer-events: none; border-radius: 10px; box-shadow: 0 0 0 2px var(--accent), 0 0 12px color-mix(in srgb, var(--accent) 45%, transparent); opacity: 0; }
.sheet.bk { isolation: isolate; }
body.fx-top .fxc { z-index: 52; }

@media (prefers-reduced-motion: reduce) {
  .kbd .key.wk.open > .sw .hs::after { animation: none; }
  .fm-block.closing, .fm-block.closing .shackle { animation-duration: 1ms; }
}

/* results card: the unlock beat (its line is reserved from the start, it only lights) */
.rc-unlock { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 4px; min-height: 16px; font-size: 12px; font-weight: 740; color: color-mix(in srgb, var(--charge) 62%, var(--ink)); opacity: 0; }
.rc-unlock.on { opacity: 1; }
.rc-lk { width: 14px; height: 14px; display: inline-block; transform-origin: 50% 80%; }
.rc-lk svg { width: 100%; height: 100%; display: block; }

/* Settings tiles anchor their own overlays (the unlock glow, and the NEW tag, which had no positioned parent) */
.set-tile, .set-swatch { position: relative; }
.cc.fx-snap .cc-fill { transition: none; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <span class="pid" id="pid" role="button" aria-label="DEV puzzle menu"></span>
    <div class="dead" id="dead" role="status" aria-live="polite"><span class="msg">Something went wrong earlier</span></div>
    <div class="stat"><span class="lbl">Mistakes</span><span class="num" id="mist">0</span></div>
    <div class="status" id="status"></div>
    <div class="hbtns">
      <div class="hbtn" id="tokenBtn" role="button" aria-label="Backup code">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3"/><path d="m16 7 3 3"/><path d="m18.5 4.5 2 2"/></svg>
      </div>
      <div class="hbtn" id="resetBtn" role="button" aria-label="Restart puzzle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </div>
      <div class="hbtn" id="muteBtn" role="button" aria-label="Toggle sound">
        <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
      </div>
    </div>
  </header>

  <main class="board-wrap">
    <div class="board" id="board" aria-label="Sudoku board"></div>
    <div class="toast" id="toast" role="dialog" aria-live="polite">
      <h2 id="toastTitle">Solved</h2>
      <p id="toastMsg"></p>
      <div class="key mod" id="againKey" role="button">
        <div class="shadow"></div><div class="wall"></div>
        <div class="cap"><span class="lbl">Play again</span></div>
      </div>
    </div>
  </main>

  <!-- --- level0: coach line (shown only while a Level 0 script runs) --- -->
  <section class="coach" id="coach" aria-live="polite" aria-label="Coach"></section>
  <!-- --- end level0 --- -->
  <section class="pad" id="pad" aria-label="Number pad"></section>
</div>
<canvas class="fxc" id="fxc" aria-hidden="true"></canvas>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet bk" id="sheet" role="dialog" aria-label="Backup code">
  <h2><span class="bk-ic" id="bkIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3"/><path d="m16 7 3 3"/><path d="m18.5 4.5 2 2"/></svg></span>Backup code</h2>
  <p class="sub">Moves all your progress, settings and your current puzzle to another device. Not a password.</p>
  <label for="tokOut">Your code <span class="bk-meta" id="tokMeta"></span></label>
  <textarea id="tokOut" readonly spellcheck="false" aria-describedby="tokMeta"></textarea>
  <div class="row">
    <div class="key mod" id="copyKey" role="button" aria-label="Copy code"><div class="shadow"></div><div class="wall"></div><div class="cap"><span class="lbl">Copy</span></div></div>
  </div>
  <label for="tokIn">Restore from a code</label>
  <textarea id="tokIn" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste a backup code here"></textarea>

const peers = [];
for (let i = 0; i < 81; i++) {
  const set = new Set();
  for (const u of CELL_UNITS[i]) for (const j of units[u]) if (j !== i) set.add(j);
  peers.push([...set].sort((a, b) => a - b));
}

// ===========================================================================
// 2. Bit helpers
// ===========================================================================

const ALL = 0x1ff; // digits 1..9
const bit = (d) => 1 << (d - 1);

/** POP[mask] = number of set bits, for 9-bit masks. */
const POP = new Uint8Array(512);
for (let m = 1; m < 512; m++) POP[m] = POP[m >> 1] + (m & 1);
const popcount = (m) => POP[m & ALL];

/** Digits in a mask, ascending. */
function digitsOf(mask) {
  const out = [];
  for (let d = 1; d <= 9; d++) if (mask & bit(d)) out.push(d);
  return out;
}
/** Lowest digit in a mask (mask must be non-zero). */
const firstDigit = (mask) => 31 - Math.clz32(mask & -mask) + 1;

const maskOfDigits = (ds) => ds.reduce((m, d) => m | bit(d), 0);

// ===========================================================================
// 3. Text helpers (names are 1-based: r4c6, row 4, column 6, box 5)
// ===========================================================================

const cellName = (i) => `r${rowOf(i) + 1}c${colOf(i) + 1}`;
const UNIT_WORDS = { row: 'row', col: 'column', box: 'box' };
const unitName = (unit) => `${UNIT_WORDS[unit.type]} ${unit.index + 1}`;

/** ['a','b','c'] -> "a, b and c" (or "or"). */
function joinWords(items, word = 'and') {
  if (items.length <= 1) return items.join('');
  return `${items.slice(0, -1).join(', ')} ${word} ${items[items.length - 1]}`;
}
const listCells = (cells, word = 'and') => joinWords(cells.map(cellName), word);
const setText = (ds) => `{${ds.join(',')}}`;
const allIn = (n) => (n === 2 ? 'both in' : 'all in');

/** "remove 5 from r1c4 and r1c5" style summary of an elimination list. */
function elimText(elims) {
  const byDigit = new Map();
  for (const [c, d] of elims) {
    if (!byDigit.has(d)) byDigit.set(d, []);
    byDigit.get(d).push(c);
  }
  return joinWords([...byDigit].map(([d, cs]) => `${d} from ${listCells(cs)}`));
}

// ===========================================================================
// 4. Grid utilities: parsing, candidates, conflicts, validity, dead ends
// ===========================================================================

/** "53..7...." / "530070000" (81 chars, '.' or '0' = empty) -> Int8Array(81). */
function parseGrid(str) {
  const clean = String(str).replace(/\s+/g, '');
  if (clean.length !== 81) throw new Error(`grid string must have 81 cells, got ${clean.length}`);
  const v = new Int8Array(81);
  for (let i = 0; i < 81; i++) {
    const ch = clean[i];
    v[i] = ch >= '1' && ch <= '9' ? ch.charCodeAt(0) - 48 : 0;
  }
  return v;
}

/** values -> 81-char string with '0' for empty cells. */
const gridToString = (values) => Array.from(values, (d) => (d ? String(d) : '0')).join('');

/** Mask of digits already placed among the peers of cell i. */
function seenMask(values, i) {
  let m = 0;
  for (const j of peers[i]) if (values[j]) m |= bit(values[j]);
  return m;
}

/** True if some peer of cell i holds digit d. */
function sees(values, i, d) {
  for (const j of peers[i]) if (values[j] === d) return true;
  return false;
}

/** Candidates from scratch: each empty cell gets every digit not seen by a peer. */
function computeCands(values) {
  const cands = new Uint16Array(81);
  for (let i = 0; i < 81; i++) if (!values[i]) cands[i] = ALL & ~seenMask(values, i);
  return cands;
}

/** Sorted list of cells whose digit also appears in one of their peers. */
function findConflicts(values) {
  const bad = new Set();
  for (const unit of units) {
    const where = new Array(10);
    for (const i of unit) {
      const d = values[i];
      if (!d) continue;
      if (where[d] === undefined) where[d] = i;
      else {
        bad.add(where[d]);
        bad.add(i);
      }
    }
  }
  return [...bad].sort((a, b) => a - b);
}

/** 81 integer entries in 0..9 and no two equal digits among peers. */
function isValidGrid(values) {
  if (!values || values.length !== 81) return false;
  for (let i = 0; i < 81; i++) {
    const d = values[i];
    if (!Number.isInteger(d) || d < 0 || d > 9) return false;
  }
  return findConflicts(values).length === 0;
}

/**
 * True if the board (values only) can no longer be completed by the basic
 * rules: a conflict, an empty cell with no candidate, or a unit where some
 * missing digit has no possible cell. Uses computeCands, not player notes.
 */
function isDeadEnd(values) {
  if (findConflicts(values).length) return true;
  const cands = computeCands(values);
  for (let i = 0; i < 81; i++) if (!values[i] && !cands[i]) return true;
  for (const unit of units) {
    let placed = 0;
    let possible = 0;
    for (const i of unit) {
      if (values[i]) placed |= bit(values[i]);
      else possible |= cands[i];
    }
    if ((placed | possible) !== ALL) return true;
  }
  return false;
}

// ===========================================================================
// 5. Techniques
//
// Each technique is a generator that yields every step it can find, in a
// fixed scan order (units: rows, then columns, then boxes; digits 1..9;
// cells in reading order). nextStep() takes the first step of the easiest
// technique that has one, so results are reproducible.
// Generators only read values/cands; they never mutate them.
// ===========================================================================

const TECHNIQUES = [
  'full-house',
  'hidden-single-box',
  'hidden-single-line',
  'naked-single',
  'pointing',
  'claiming',
  'naked-pair',
  'hidden-pair',
];

const TECH_INFO = {
  'full-house': { name: 'Full House', world: 0 },
  'hidden-single-box': { name: 'Hidden Single (box)', world: 1 },
  'hidden-single-line': { name: 'Hidden Single (row/column)', world: 1 },
  'naked-single': { name: 'Naked Single', world: 2 },
  pointing: { name: 'Pointing', world: 3 },
  claiming: { name: 'Claiming', world: 3 },
  'naked-pair': { name: 'Naked Pair', world: 4 },
  'hidden-pair': { name: 'Hidden Pair', world: 4 },
};

const TECH_RANK = Object.fromEntries(TECHNIQUES.map((t, k) => [t, k]));

function makeStep(tech, u, pattern, digits, place, eliminate, text) {
  return {
    tech,
    unit: u === null ? null : unitInfo(u),
    pattern,
    digits,
    place,
    eliminate,
    text,
  };
}

const sortElims = (elims) => elims.sort((a, b) => a[0] - b[0] || a[1] - b[1]);

// --- 5.1 Full house -------------------------------------------------------
// A unit with exactly one empty cell: it gets the one digit the unit is missing.
function* fullHouse(values, cands) {
  for (let u = 0; u < 27; u++) {
    let empty = -1;
    let count = 0;
    let placed = 0;
    for (const i of units[u]) {
      if (values[i]) placed |= bit(values[i]);
      else {
        empty = i;
        count++;
      }
    }
    if (count !== 1) continue;
    const missing = ALL & ~placed;
    if (popcount(missing) !== 1) continue; // unit has a duplicate: broken board
    const d = firstDigit(missing);
    if (!(cands[empty] & bit(d))) continue; // contradiction in cands: not a safe step
    const name = unitName(unitInfo(u));
    yield makeStep('full-house', u, [empty], [d], { cell: empty, digit: d }, [],
      `${cap(name)} has only one empty cell left, ${cellName(empty)}, and the only digit it is missing is ${d}.`);
  }
}

const cap = (s) => s[0].toUpperCase() + s.slice(1);

// --- 5.2/5.3 Hidden singles ----------------------------------------------
// Within one unit, digit d has exactly one cell left where it can go.
function* hiddenSingles(values, cands, uFrom, uTo, tech) {
  for (let u = uFrom; u < uTo; u++) {
    const cells = units[u];
    let placed = 0;
    for (const i of cells) if (values[i]) placed |= bit(values[i]);
    for (let d = 1; d <= 9; d++) {
      if (placed & bit(d)) continue;
      const b = bit(d);
      let spot = -1;
      let count = 0;
      for (const i of cells) {
        if (!values[i] && cands[i] & b) {
          spot = i;
          if (++count > 1) break;
        }
      }
      if (count !== 1) continue;
      const info = unitInfo(u);
      const name = unitName(info);
      // Explain why the other cells are out: do they all simply see a d?
      const others = cells.filter((i) => !values[i] && i !== spot);
      const allSee = others.every((i) => sees(values, i, d));
      const where = info.type === 'box' ? 'row or column' : info.type === 'row' ? 'column or box' : 'row or box';
      let why;
      if (others.length === 0) why = '';
      else if (allSee) why = ` Every other empty cell in ${name} already sees a ${d} in its ${where}.`;
      else why = ` Every other empty cell in ${name} has been ruled out for ${d}.`;
      yield makeStep(tech, u, [spot], [d], { cell: spot, digit: d }, [],
        `In ${name}, ${cellName(spot)} is the only place left for a ${d}.${why}`);
    }
  }
}

// --- 5.4 Naked single ------------------------------------------------------
// A cell with exactly one candidate.
function* nakedSingle(values, cands) {
  for (let i = 0; i < 81; i++) {
    if (values[i] || popcount(cands[i]) !== 1) continue;
    const d = firstDigit(cands[i]);
    const fromValues = (ALL & ~seenMask(values, i)) === cands[i];
    const why = fromValues
      ? `every other digit already appears in its row, column or box`
      : `all its other candidates have been ruled out`;
    yield makeStep('naked-single', null, [i], [d], { cell: i, digit: d }, [],
      `${cellName(i)} can only be ${d}: ${why}.`);
  }
}

// --- 5.5 Pointing ----------------------------------------------------------
// In a box, every candidate for d lies in one row (or column). The box's d
// must be in that line, so no other cell of the line (outside the box) can be d.
function* pointing(values, cands) {
  for (let b = 0; b < 9; b++) {
    const cells = BOXES[b];
    for (let d = 1; d <= 9; d++) {
      const m = bit(d);
      const pos = cells.filter((i) => !values[i] && cands[i] & m);
      if (pos.length < 2) continue; // 1 = hidden single, 0 = contradiction
      if (cells.some((i) => values[i] === d)) continue;
      for (const lineType of ['row', 'col']) {
        const key = lineType === 'row' ? rowOf : colOf;
        const k = key(pos[0]);
        if (!pos.every((i) => key(i) === k)) continue;
        const line = lineType === 'row' ? ROWS[k] : COLS[k];
        const elims = line.filter((i) => boxOf(i) !== b && !values[i] && cands[i] & m).map((i) => [i, d]);
        if (!elims.length) continue;
        const lineName = unitName({ type: lineType, index: k });
        yield makeStep('pointing', 18 + b, pos, [d], null, elims,
          `In box ${b + 1}, ${d} can only go in ${listCells(pos, 'or')}, ${allIn(pos.length)} ${lineName}. ` +
          `So the ${d} for ${lineName} must be inside box ${b + 1}: remove ${elimText(elims)}.`);
      }
    }
  }
}

// --- 5.6 Claiming (box-line reduction) ------------------------------------
// In a row/column, every candidate for d lies in one box. The line's d must
// be in that box, so no other cell of the box (off the line) can be d.
function* claiming(values, cands) {
  for (let u = 0; u < 18; u++) {
    const cells = units[u];
    for (let d = 1; d <= 9; d++) {
      const m = bit(d);
      const pos = cells.filter((i) => !values[i] && cands[i] & m);
      if (pos.length < 2) continue;
      if (cells.some((i) => values[i] === d)) continue;
      const b = boxOf(pos[0]);
      if (!pos.every((i) => boxOf(i) === b)) continue;
      const inLine = new Set(cells);
      const elims = BOXES[b].filter((i) => !inLine.has(i) && !values[i] && cands[i] & m).map((i) => [i, d]);
      if (!elims.length) continue;
      const lineName = unitName(unitInfo(u));
      yield makeStep('claiming', u, pos, [d], null, elims,
        `In ${lineName}, ${d} can only go in ${listCells(pos, 'or')}, ${allIn(pos.length)} box ${b + 1}. ` +
        `So the ${d} for box ${b + 1} must be in ${lineName}: remove ${elimText(elims)}.`);
    }
  }
}

// --- 5.7 Naked pair --------------------------------------------------------
// Two cells in a unit with the same two candidates {a,b}: those two cells take
// a and b between them, so every other cell in every unit they share loses a, b.
function sharedUnits(i, j) {
  return CELL_UNITS[i].filter((u) => CELL_UNITS[j].includes(u));
}

/** Eliminations of a naked pair, grouped by shared unit (only units with any). */
function nakedPairElims(values, cands, i, j, mask) {
  const perUnit = [];
  const seen = new Set();
  const elims = [];
  for (const u of sharedUnits(i, j)) {
    let any = false;
    for (const k of units[u]) {
      if (k === i || k === j || values[k] || !(cands[k] & mask)) continue;
      any = true;
      for (const d of digitsOf(cands[k] & mask)) {
        const key = k * 10 + d;
        if (!seen.has(key)) {
          seen.add(key);
          elims.push([k, d]);
        }
      }
    }
    if (any) perUnit.push(u);
  }
  return { perUnit, elims: sortElims(elims) };
}

function* nakedPair(values, cands) {
  const done = new Set();
  for (let u = 0; u < 27; u++) {
    const cells = units[u].filter((i) => !values[i] && popcount(cands[i]) === 2);
    for (let x = 0; x < cells.length; x++) {
      for (let y = x + 1; y < cells.length; y++) {
        const i = cells[x];
        const j = cells[y];
        if (cands[i] !== cands[j]) continue;
        const key = i * 81 + j;
        if (done.has(key)) continue;
        done.add(key);
        const mask = cands[i];
        const { perUnit, elims } = nakedPairElims(values, cands, i, j, mask);
        if (!elims.length) continue;
        const ds = digitsOf(mask);
        const names = perUnit.map((v) => unitName(unitInfo(v)));
        yield makeStep('naked-pair', perUnit[0], [i, j], ds, null, elims,
          `${cellName(i)} and ${cellName(j)} can only be ${ds[0]} or ${ds[1]}, ` +
          `so no other cell in ${joinWords(names, 'or')} can be ${ds[0]} or ${ds[1]}.`);
      }
    }
  }
}

// --- 5.8 Hidden pair -------------------------------------------------------
// In a unit, digits a and b each fit in only the same two cells. Those cells
// must hold a and b, so all their other candidates go.
function* hiddenPair(values, cands) {
  for (let u = 0; u < 27; u++) {
    const cells = units[u];
    let placed = 0;
    for (const i of cells) if (values[i]) placed |= bit(values[i]);
    // pos[d] = cells of this unit where d is a candidate (only for 2-spot digits)
    const two = [];
    const pos = new Array(10);
    for (let d = 1; d <= 9; d++) {
      if (placed & bit(d)) continue;
      const p = cells.filter((i) => !values[i] && cands[i] & bit(d));
      if (p.length === 2) {
        pos[d] = p;
        two.push(d);
      }
    }
    for (let x = 0; x < two.length; x++) {
      for (let y = x + 1; y < two.length; y++) {
        const a = two[x];
        const b = two[y];
        if (pos[a][0] !== pos[b][0] || pos[a][1] !== pos[b][1]) continue;
        const pair = pos[a];
        const keep = bit(a) | bit(b);
        const elims = [];
        for (const i of pair) for (const d of digitsOf(cands[i] & ~keep)) elims.push([i, d]);
        if (!elims.length) continue;
        const name = unitName(unitInfo(u));
        const extra = pair
          .filter((i) => cands[i] & ~keep)
          .map((i) => `${cellName(i)} loses ${joinWords(digitsOf(cands[i] & ~keep))}`);
        yield makeStep('hidden-pair', u, [...pair], [a, b], null, sortElims(elims),
          `In ${name}, ${a} and ${b} can only go in ${cellName(pair[0])} and ${cellName(pair[1])}, ` +
          `so those two cells must be ${a} and ${b}. Their other candidates go: ${joinWords(extra)}.`);
      }
    }
  }
}

const GENERATORS = {
  'full-house': fullHouse,
  'hidden-single-box': (v, c) => hiddenSingles(v, c, 18, 27, 'hidden-single-box'),
  'hidden-single-line': (v, c) => hiddenSingles(v, c, 0, 18, 'hidden-single-line'),
  'naked-single': nakedSingle,
  pointing,
  claiming,
  'naked-pair': nakedPair,
  'hidden-pair': hiddenPair,
};

// ===========================================================================
// 6. Step API: nextStep, allSteps, applyStep
// ===========================================================================

function toSet(allowed) {
  if (allowed instanceof Set) return allowed;
  return new Set(allowed ?? TECHNIQUES);
}

/**
 * Easiest available step among `allowed` techniques (array or Set of ids),
 * or null if none applies. Does not mutate values or cands.
 */
function nextStep(values, cands, allowed = TECHNIQUES) {
  const set = toSet(allowed);
  for (const tech of TECHNIQUES) {
    if (!set.has(tech)) continue;
    const r = GENERATORS[tech](values, cands).next();
    if (!r.done) return r.value;
  }
  return null;
}

/**
 * Every available step, easiest technique first, in scan order within each
 * technique. Useful for hints ("show me all pointing moves") and for checking
 * claims. Lazy: stop iterating whenever you like.
 */
function* allSteps(values, cands, allowed = TECHNIQUES) {
  const set = toSet(allowed);
  for (const tech of TECHNIQUES) if (set.has(tech)) yield* GENERATORS[tech](values, cands);
}

/**
 * Apply a step in place. Placement: set the value, clear its cands, and
 * remove the digit from every peer. Elimination: clear the listed bits.
 */
function applyStep(values, cands, step) {
  if (step.place) {
    const { cell, digit } = step.place;
    values[cell] = digit;
    cands[cell] = 0;
    const m = ~bit(digit);
    for (const j of peers[cell]) cands[j] &= m;
  }
  for (const [cell, digit] of step.eliminate || []) cands[cell] &= ~bit(digit);
}

// ===========================================================================
// 7. Logical solving and rating
// ===========================================================================

/**
 * Solve with human techniques only. Works on copies.
 * Returns { solved, steps, values } where values is a plain array.
 * A board with conflicts returns immediately with no steps.
 */
function solveLogically(values, allowed = TECHNIQUES) {
  const v = Int8Array.from(values);
  const set = toSet(allowed);
  const steps = [];
  if (findConflicts(v).length) return { solved: false, steps, values: Array.from(v) };
  const c = computeCands(v);
  // Each step places a digit or removes at least one candidate, so 81 + 729
  // steps is a hard upper bound; the guard only protects against bugs.
  for (let guard = 0; guard < 810; guard++) {
    const step = nextStep(v, c, set);
    if (!step) break;
    applyStep(v, c, step);
    steps.push(step);
  }
  const solved = v.every((d) => d !== 0) && findConflicts(v).length === 0;
  return { solved, steps, values: Array.from(v) };
}

/**
 * Rate a puzzle with all techniques.
 * hardest = hardest technique used (even if unsolved; check `solved`), or
 * null if no step was needed/possible. counts = steps per technique.
 */
function rate(values) {
  const { solved, steps } = solveLogically(values);
  const counts = {};
  let hardest = null;
  for (const s of steps) {
    counts[s.tech] = (counts[s.tech] || 0) + 1;
    if (hardest === null || TECH_RANK[s.tech] > TECH_RANK[hardest]) hardest = s.tech;
  }
  return { solved, hardest, counts, steps: steps.length };
}

// ===========================================================================
// 8. Backtracking (uniqueness only — never used for teaching)
// ===========================================================================

/**
 * Core bitmask backtracker with MRV (most constrained cell first).
 * Returns {count, solution} where solution is the first one found.
 */
function backtrack(values, limit) {
  const grid = Int8Array.from(values);
  const rowM = new Uint16Array(9);
  const colM = new Uint16Array(9);
  const boxM = new Uint16Array(9);
  for (let i = 0; i < 81; i++) {
    const d = grid[i];
    if (!d) continue;
    if (d < 1 || d > 9) return { count: 0, solution: null };
    const m = bit(d);
    const r = rowOf(i), c = colOf(i), b = boxOf(i);
    if ((rowM[r] | colM[c] | boxM[b]) & m) return { count: 0, solution: null }; // duplicate
    rowM[r] |= m;
    colM[c] |= m;
    boxM[b] |= m;
  }
  const empties = [];
  for (let i = 0; i < 81; i++) if (!grid[i]) empties.push(i);
  const ER = empties.map(rowOf), EC = empties.map(colOf), EB = empties.map(boxOf);
  let count = 0;
  let solution = null;
  const n = empties.length;

  // empties[0..k-1] are filled; pick the best remaining cell and swap it to k.
  function search(k) {
    if (k === n) {
      count++;
      if (!solution) solution = Array.from(grid);
      return count >= limit;
    }
    let best = -1, bestFree = 0, bestPop = 10;
    for (let t = k; t < n; t++) {
      const free = ALL & ~(rowM[ER[t]] | colM[EC[t]] | boxM[EB[t]]);
      const p = POP[free];
      if (p < bestPop) {
        bestPop = p; best = t; bestFree = free;
        if (p <= 1) break;
      }
    }
    if (bestPop === 0) return false;
    swap(k, best);
    const cell = empties[k], r = ER[k], c = EC[k], b = EB[k];
    let free = bestFree;
    while (free) {
      const m = free & -free;
      free ^= m;
      rowM[r] |= m; colM[c] |= m; boxM[b] |= m;
      grid[cell] = 31 - Math.clz32(m) + 1;
      const stop = search(k + 1);
      rowM[r] ^= m; colM[c] ^= m; boxM[b] ^= m;
      grid[cell] = 0;
      if (stop) { swap(k, best); return true; }
    }
    swap(k, best);
    return false;
  }
  function swap(a, b) {
    if (a === b) return;
    [empties[a], empties[b]] = [empties[b], empties[a]];
    [ER[a], ER[b]] = [ER[b], ER[a]];
    [EC[a], EC[b]] = [EC[b], EC[a]];
    [EB[a], EB[b]] = [EB[b], EB[a]];
  }
  search(0);
  return { count, solution };
}

/** Number of solutions, capped at `limit` (0, 1, ... limit). */
function countSolutions(values, limit = 2) {
  return backtrack(values, Math.max(1, limit)).count;
}

/** First solution found by backtracking (plain array), or null. */
function findSolution(values) {
  return backtrack(values, 1).solution;
}

/** The solution if it is unique, else null. */
function uniqueSolution(values) {
  const r = backtrack(values, 2);
  return r.count === 1 ? r.solution : null;
}

// ===========================================================================
// 9. "Check my thinking"
// ===========================================================================

const yes = (text) => ({ ok: true, text });
const no = (text) => ({ ok: false, text });

/** Positions of digit d (as candidates in empty cells) within unit u. */
const positionsIn = (values, cands, u, d) => units[u].filter((i) => !values[i] && cands[i] & bit(d));
const unitHas = (values, u, d) => units[u].some((i) => values[i] === d);
const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));

/**
 * Check a player's claim against the current board.

//   sudoku.profile.v1 (profile.js)   sudoku.settings.v1 (settings.js)   sudoku.free.v1 (fmstore.js)
//   sudoku.save.v1.<id> / sudoku.meta.v1.<id> (token.js)                sudoku.lastctx / sudoku.last (progress.js)
// It adds one key: sudoku.backup.v2 = the latest backup code (the unified autosave snapshot).




















/* --- step10: the copy confirmation travels from the Copy key to the code box --- */

/* --- end step10 --- */



const F = makeFormat(DATA);
const SNAPSHOT_KEY = 'sudoku.backup.v2';
const KEY_PREFIX = 'sudoku.';

/* =========================================================================
   SNAPSHOT: everything the code carries, read from the stores on demand
   ========================================================================= */
let sStale = false;          // after a load / undo with the board hidden, S still holds the old puzzle
function boardSource(id) {
  const b = boardFor(id);
  if (!b) return null;
  if (S.id === id && !sStale && (S.mode === 'free' || S.mode === 'spot')) {
    return { values: Array.from(S.values), notes: Array.from(S.notes), mistakes: S.mistakes, solved: S.solved,
      silentWrong: S.silentWrong, paidHints: S.paidHints, given: b.given, start: b.notes };
  }
  const sv = readSave(id, b.given);
  if (!sv) return null;
  return { values: sv.values, notes: sv.notes, mistakes: sv.mistakes, solved: sv.solved,
    silentWrong: sv.meta.silentWrong | 0, paidHints: sv.meta.paidHints | 0, given: b.given, start: b.notes };
}
/** The puzzle in progress (unsolved, with player input), or null. */
function boardInProgress(id, fm) {
  if (!id || !F.isShipped(id)) return null;
  const src = boardSource(id);
  if (!src || src.solved) return null;
  let input = src.mistakes > 0 || src.paidHints > 0;
  for (let i = 0; i < 81 && !input; i++) {
    if (src.values[i] && !src.given[i]) input = true;
    else if (!src.values[i] && (src.notes[i] & 0x1FF) !== (src.start[i] & 0x1FF)) input = true;
  }
  if (!input) return null;
  const live = clockHooks.ms ? clockHooks.ms(id) : null;          // a running Free Mode clock (Date.now based)
  const elapsed = typeof live === 'number' ? live : (fm.clock[id] || 0);
  return { values: src.values, notes: src.notes, mistakes: src.mistakes, paidHints: src.paidHints, silentWrong: src.silentWrong, elapsed };
}

function snapshot() {
  const p = getProfile(), s = getSettings(), fm = getFreeModeState();
  const lp = lastPlayed();
  const last = lp && (F.isShipped(lp.id) || F.isL0(lp.id)) ? lp.id : '';
  const levels = {};
  for (const [id, c] of Object.entries(p.levels)) {
    const L = levelInfo(id);
    if (L && (L.k === 0 || c >= 1)) levels[id] = L.k === 0 ? 0 : c;
  }
  return {
    levels,
    skip: Object.keys(p.flags.skip || {}).filter(k => p.flags.skip[k]).map(Number),
    mastered: p.mastered.slice(), pendingBuild: (p.flags.pendingBuild || []).slice(),
    expertise: { ...p.expertise },
    fillNotes: !!p.unlocks.fillNotes, badge: !!p.flags.badge, devUnlockAll: !!p.flags.devUnlockAll,
    lastFree: p.flags.lastFree || '',
    settings: isClassic() ? { ...DEFAULTS, sound: s.sound, switchVol: s.switchVol } : { style: s.style, layout: s.layout, preset: s.preset, sound: s.sound, switchVol: s.switchVol },
    free: { played: fm.played, solved: fm.solved, best: fm.best, current: fm.current, feedback: fm.feedback, challenge: fm.challenge, daily: fm.daily },
    last,
    board: last ? boardInProgress(last, fm) : null
  };
}
const currentCode = () => F.encode(snapshot());

/* =========================================================================
   APPLY (atomic) + UNDO
   ========================================================================= */
function captureStorage() {
  const m = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(KEY_PREFIX)) m[k] = localStorage.getItem(k); } } catch (e) {}
  return m;
}
function writeStorage(m) {
  try {
    const drop = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(KEY_PREFIX) && !(k in m)) drop.push(k); }
    for (const k of drop) localStorage.removeItem(k);
    for (const k of Object.keys(m)) localStorage.setItem(k, m[k]);
  } catch (e) {}
}
const boardShowing = () => !currentScreen() && !freeModeOpen();

/** Everything a load can change, so it can be put back. */
function capture() {
  flushSave();                  // the board on screen, as it is now
  flushFreeClock();             // a running Free Mode clock, as it is now
  return { storage: captureStorage(), profile: getProfile(), settings: getSettings(), free: getFreeModeState() };
}
function restore(prev) {
  cancelSave(); resetFreeSession();
  writeStorage(prev.storage);
  setProfile(prev.profile);
  if (prev.settings.style !== 'classic') setSettings(prev.settings);
  setFreeModeState(prev.free);
  writeStorage(prev.storage);   // exactly as it was (the setters may add keys)
  syncFreeMode();
  afterRestore();
}

function spotMeta(id, values, notes) {
  const b = boardFor(id), m = { silentWrong: 0, paidHints: 0 };
  if (b && b.mode === 'spot') {
    m.erased = [];
    for (let c = 0; c < 81; c++) if (!values[c]) for (let d = 1; d <= 9; d++) { const bt = 1 << (d - 1); if ((b.notes[c] & bt) && !(notes[c] & bt)) m.erased.push(c * 10 + d); }
    m.found = -1;
  }
  return m;
}
function setLast(id) {
  try {
    if (!id) { localStorage.removeItem('sudoku.lastctx'); localStorage.removeItem('sudoku.last'); return; }
    const L = levelInfo(id), ctx = L ? { id, world: L.world, k: L.k } : { id };
    localStorage.setItem('sudoku.lastctx', JSON.stringify(ctx));
    if (F.isShipped(id)) localStorage.setItem('sudoku.last', id);
  } catch (e) {}
}

function applyV2(snap) {
  const prof = {
    v: 1, levels: { ...snap.levels }, mastered: snap.mastered.slice(),
    expertise: { ...snap.expertise },
    unlocks: { fillNotes: snap.fillNotes, items: [] },
    flags: { skip: Object.fromEntries(snap.skip.map(w => [String(w), true])), clean: {}, badge: snap.badge, fresh: [],
      pendingBuild: snap.pendingBuild.slice(), devUnlockAll: snap.devUnlockAll, lastFree: snap.lastFree }
  };
  setProfile(prof);
  setSettings(snap.settings);
  const f = snap.free, clock = {};
  if (snap.board && F.isFreeId(snap.last)) clock[snap.last] = snap.board.elapsed;
  setFreeModeState({ v: 1, played: f.played, solved: f.solved, best: f.best, current: f.current, clock, daily: f.daily, feedback: f.feedback, challenge: f.challenge });
  if (snap.last && F.isShipped(snap.last)) {
    if (snap.board) {
      const b = snap.board, m = spotMeta(snap.last, b.values, b.notes);
      m.silentWrong = b.silentWrong; m.paidHints = b.paidHints;
      writeSave(snap.last, { values: b.values, notes: b.notes, mistakes: b.mistakes, solved: false }, m);
    } else removeSave(snap.last);       // nothing in progress there: start it fresh, like the other device
  }
  setLast(snap.last);
}
function applySdk1(board) {
  const m = spotMeta(board.id, board.values, board.notes);
  writeSave(board.id, board, m);
  setLast(board.id);
}

function afterRestore() {
  const show = boardShowing();
  sStale = !show;
  resumeAfterRestore(show);
}

let undoState = null;
/** Decode and apply a pasted code. Returns { ok, kind, message, code? }. */
function loadCode(text) {
  let res;
  try { res = F.decode(text, { preferId: S.id }); }
  catch (e) { return { ok: false, code: e.code || 'damaged', message: messageFor(e) }; }
  cancelAllPresses();
  const prev = capture();
  cancelSave(); resetFreeSession();
  try {
    if (res.kind === 'v2') applyV2(res.snap); else applySdk1(res.board);
  } catch (e) {
    console.error(e);
    restore(prev);
    return { ok: false, code: 'damaged', message: messageFor(e) };
  }
  syncFreeMode();
  afterRestore();
  undoState = prev;
  writeSnapshot();
  return { ok: true, kind: res.kind,
    message: res.kind === 'v2' ? 'Loaded. Your progress, settings and puzzle are here.' : 'Puzzle loaded (an older code: only the board).' };
}
function undoLoad() {
  if (!undoState) return false;
  const prev = undoState;
  undoState = null;
  restore(prev);
  writeSnapshot();
  return true;
}
const canUndo = () => !!undoState;

/* =========================================================================
   UNIFIED AUTOSAVE: one snapshot (the current backup code) under
   sudoku.backup.v2, written 250 ms after any change and when the page hides.
   The per-module keys stay the source of truth; this is derived from them.
   (The board's own save keeps its separate 250 ms timer in token.js.)
   ========================================================================= */
let snapTimer = 0;
function writeSnapshot() {
  if (snapTimer) { clearTimeout(snapTimer); snapTimer = 0; }
  try { localStorage.setItem(SNAPSHOT_KEY, currentCode()); } catch (e) {}
}
function scheduleSnapshot() { clearTimeout(snapTimer); snapTimer = setTimeout(writeSnapshot, 250); }

/* =========================================================================
   THE SHEET
   ========================================================================= */
let sheetEl, sheetBg, tokOut, tokIn, tokMsg, tokMeta, undoRow;
function say(text, kind) { tokMsg.textContent = text; tokMsg.className = 'msg' + (kind ? ' ' + kind : ''); }
function metaLine(snap, code) {
  const n = code.length;
  if (!snap.board) return `${n} characters`;
  const e = entry(snap.last), L = levelInfo(snap.last), cap = t => t ? t[0].toUpperCase() + t.slice(1) : '';
  const what = L ? `World ${L.world} · ${L.k <= 6 ? `Spot it ${L.k}` : L.k <= 12 ? `Use it ${L.k - 6}` : 'Master'}`
    : e && e.kind === 'quick' ? `Quick Play · ${cap(e.band)}` : e && e.kind === 'daily' ? `Daily · ${cap(e.item.band)}` : 'a puzzle';
  return `${n} characters · with ${what}`;
}
function fillCode() {
  const snap = snapshot(), code = F.encode(snap);
  tokOut.value = code;
  tokMeta.textContent = metaLine(snap, code);
}
function openSheet() {
  cancelAllPresses(); release();
  closeSettings();
  fillCode();
  tokIn.value = ''; say('');
  undoRow.classList.toggle('show', canUndo());
  UI.sheetOpen = true; sheetEl.classList.add('show'); sheetBg.classList.add('show');
}
function closeSheet() {
  UI.sheetOpen = false; sheetEl.classList.remove('show'); sheetBg.classList.remove('show');
  tokIn.blur(); tokOut.blur();
}

/* Load success: a bolt from the Load key into the sheet's header key icon. */
function loadEffect() {
  const ic = $('bkIcon'), lk = $('loadKey');
  const land = () => { ic.classList.remove('pop'); void ic.offsetWidth; ic.classList.add('pop'); SPARKS.crackle(ic, 10); };
  if (reducedMotion()) { land(); return; }
  document.body.classList.add('bk-fx');               // spark canvas above the sheet for a moment
  const life = SPARKS.bolt(lk, ic, { bow: 0.18, done: land });
  setTimeout(() => document.body.classList.remove('bk-fx'), life + 520);
}
/* step10: Copy → a short pulse leaves the Copy key and lands on the code box, which
   acknowledges with a ring (purpose: confirms exactly what was copied). */
const BKFX = { copies: 0 };
let ackEl = null;
function copyFx() {
  BKFX.copies++;
  if (!ackEl) { ackEl = div('bk-ack', sheetEl); ackEl.setAttribute('aria-hidden', 'true'); }
  Object.assign(ackEl.style, { left: tokOut.offsetLeft + 'px', top: tokOut.offsetTop + 'px', width: tokOut.offsetWidth + 'px', height: tokOut.offsetHeight + 'px' });
  document.body.classList.add('fx-top');
  const flight = FX.carry($('copyKey'), tokOut);
  setTimeout(() => {
    ackEl.animate([{ opacity: 0 }, { opacity: 1, offset: 0.2 }, { opacity: 0 }], { duration: 520, easing: 'ease-out' });
    sfx.noteTick(0, 3);
  }, flight);
  setTimeout(() => document.body.classList.remove('fx-top'), flight + 560);
}
function shake(el) {
  if (reducedMotion()) return;
  el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(-2px)' }, { transform: 'translateX(0)' }],
    { duration: 260, easing: 'ease-out' });
}

function doLoad() {
  const r = loadCode(tokIn.value);
  if (!r.ok) { sfx.error(); say(r.message, 'bad'); shake(tokIn); undoRow.classList.toggle('show', canUndo()); return; }
  sfx.latch(0);
  say(r.message, 'ok');
  tokIn.value = '';
  fillCode();
  undoRow.classList.add('show');
  loadEffect();
}
function doUndo() {
  if (!undoLoad()) return;
  sfx.mod();
  fillCode();
  undoRow.classList.remove('show');
  say('Load undone. Everything is back as it was.', 'ok');
}

function buildSettingsRow(sheet) {
  if (sheet.querySelector('.set-bk')) return;
  const sec = div('set-sec set-bksec', null);
  sec.appendChild(Object.assign(document.createElement('h3'), { textContent: 'Backup' }));
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'set-bk';
  b.innerHTML = `<span class="bk-ic" aria-hidden="true">${$('bkIcon').innerHTML}</span><span class="set-bk-t"><b>Backup &amp; restore</b><small>Move your progress to another device</small></span><span class="set-bk-ch" aria-hidden="true">›</span>`;
  b.setAttribute('aria-label', 'Backup and restore');
  b.addEventListener('click', () => { sfx.mod(); openSheet(); });
  sec.appendChild(b);
  const done = sheet.querySelector('.set-done');
  sheet.insertBefore(sec, done || null);
}
function buildHomeLink() {
  const top = document.querySelector('#home .home-top');
  if (!top || top.querySelector('.home-bk')) return;
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'home-bk';
  b.innerHTML = `<span class="bk-ic" aria-hidden="true">${$('bkIcon').innerHTML}</span>Backup`;
  b.setAttribute('aria-label', 'Backup code');
  b.addEventListener('click', () => { sfx.mod(); openSheet(); });
  top.appendChild(b);
}

/* Called once from main.js, last. */
function initBackup() {
  sheetEl = $('sheet'); sheetBg = $('sheetBg'); tokOut = $('tokOut'); tokIn = $('tokIn'); tokMsg = $('tokMsg');
  tokMeta = $('tokMeta'); undoRow = $('undoRow');
  sheetHooks.open = openSheet;
  bindHeaderBtn($('tokenBtn'), () => { sfx.mod(); openSheet(); });
  sheetBg.addEventListener('pointerdown', e => { e.preventDefault(); closeSheet(); });
  bindPress($('closeKey'), () => { sfx.mod(); closeSheet(); });
  // Clipboard must run inside a click handler, so Copy listens to click too
  $('copyKey').addEventListener('pointerdown', e => { e.preventDefault(); sfx.unlock(); pressStart('p' + e.pointerId, $('copyKey'), () => sfx.mod(), null); });
  $('copyKey').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(tokOut.value); say('Copied. Paste it in the other browser or device.', 'ok'); copyFx(); }
    catch (e) { tokOut.focus(); tokOut.select(); say('Copy was blocked here. The code is selected, copy it manually.', 'bad'); }
  });
  bindPress($('loadKey'), doLoad);
  bindPress($('undoKey'), doUndo);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetEl.classList.contains('show')) closeSheet(); });

  const s = document.getElementById('setSheet');
  if (s) buildSettingsRow(s);
  buildHomeLink();

  gameHooks.start.push(() => { sStale = false; });
  // unified autosave
  onProfile(scheduleSnapshot);
  onSettings(scheduleSnapshot);
  onFreeModeState(scheduleSnapshot);
  const prev = hooks.afterRefresh;
  hooks.afterRefresh = () => { if (prev) prev(); scheduleSnapshot(); };
  window.addEventListener('pagehide', writeSnapshot);
  document.addEventListener('visibilitychange', () => { if (document.hidden) writeSnapshot(); });
  scheduleSnapshot();

  if (DEBUG) {
    window.__debug = window.__debug || {};
    window.__debug.backup = { F, tag: puzzleTag, snapshot, currentCode, loadCode, undoLoad, canUndo, openSheet, closeSheet, writeSnapshot, SNAPSHOT_KEY,
      keys: { PROFILE_KEY, SETTINGS_KEY, FM_KEY } };
  }
}
return Object.freeze({ F, SNAPSHOT_KEY, snapshot, currentCode, loadCode, undoLoad, canUndo, writeSnapshot, openSheet, closeSheet, BKFX, initBackup });
